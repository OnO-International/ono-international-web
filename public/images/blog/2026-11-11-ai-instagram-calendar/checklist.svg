<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" width="720" height="820" role="img" aria-label="投稿前のチェックリスト：価格・日付・営業時間は正しい、根拠のない言い切りがない、写り込みは本人の了承済み、他人の写真・イラストは使わない、個人情報をAIに入れていない、自分の言葉を1文足した" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="820" rx="32" fill="#f7f4ec"/><text x="360" y="82" font-size="40" font-weight="800" fill="#272923" text-anchor="middle">投稿前チェックリスト</text><rect x="40" y="124" width="640" height="656" rx="28" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="72" y="170" width="44" height="44" rx="10" fill="none" stroke="#386377" stroke-width="4"/><path d="M82 192 l10 10 l18 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="202" font-size="29" font-weight="700" fill="#272923">価格・日付・営業時間は正しい</text><line x1="72" y1="244" x2="648" y2="244" stroke="#ece8db" stroke-width="3"/><rect x="72" y="274" width="44" height="44" rx="10" fill="none" stroke="#386377" stroke-width="4"/><path d="M82 296 l10 10 l18 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="306" font-size="29" font-weight="700" fill="#272923">根拠のない言い切りがない</text><line x1="72" y1="348" x2="648" y2="348" stroke="#ece8db" stroke-width="3"/><rect x="72" y="378" width="44" height="44" rx="10" fill="none" stroke="#386377" stroke-width="4"/><path d="M82 400 l10 10 l18 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="410" font-size="29" font-weight="700" fill="#272923">写り込みは本人の了承済み</text><line x1="72" y1="452" x2="648" y2="452" stroke="#ece8db" stroke-width="3"/><rect x="72" y="482" width="44" height="44" rx="10" fill="none" stroke="#386377" stroke-width="4"/><path d="M82 504 l10 10 l18 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="514" f