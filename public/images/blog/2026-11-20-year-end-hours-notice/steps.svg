<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 854" role="img" aria-label="AIで営業案内をそろえる4ステップ：1 元原稿を作る、2 AIに場所別の文章を頼む、3 日付と曜日を人が確かめる、4 載せた場所に印をつける" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="854" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">営業案内をそろえる4ステップ</text><rect x="40" y="116" width="640" height="140" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="186" r="40" fill="#386377"/><text x="112" y="201" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">1</text><text x="180" y="178" font-size="35" font-weight="800" fill="#272923">元原稿を作る</text><text x="180" y="224" font-size="29" fill="#64665d">最終日・休み・再開日・予約</text><path d="M360 266 v20 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="302" width="640" height="140" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="372" r="40" fill="#386377"/><text x="112" y="387" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">2</text><text x="180" y="364" font-size="35" font-weight="800" fill="#272923">AIに場所別の文章を頼む</text><text x="180" y="410" font-size="29" fill="#64665d">HP・SNS・貼り紙・留守電用に</text><path d="M360 452 v20 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="488" width="640" height="140" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="558" r="40" fill="#dd7c43"/><text x="112" y="573" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">3</text><text x="180" y="550" font-size="35" font-weight="800" fill="#272923">日付と曜日を人が確かめる</text><text x="180" y="596" font-size="29" fill="#64665d">カレンダーを横に置いて照合</text><path d="M360 638 v20 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="674" width="640" height="140" rx="26" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="112" cy="744" r="40" fill="#386377"/><text x="112" y="759" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">4</text><text x="180" y="736" font-size="35" font-weight="800" fill="#272923">載せた場所に印をつける</text><text x="180" y="782" font-size="29" fill="#64665d">年明けに下げる日も決める</text></svg>