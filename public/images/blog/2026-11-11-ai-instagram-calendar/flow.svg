<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1004" width="720" height="1004" role="img" aria-label="1か月分の投稿カレンダーを作る4ステップ：1 お店の材料を書き出す（看板商品・こだわり・予定）、2 AIにネタを30個出してもらう（5種類に分けて頼む）、3 曜日の型に当てはめて日付入りのカレンダーにする、4 撮影リストを作り開店前の30分などにまとめて撮る" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="1004" rx="32" fill="#f7f4ec"/><text x="360" y="82" font-size="40" font-weight="800" fill="#272923" text-anchor="middle">1か月分を作る4ステップ</text><rect x="40" y="130" width="640" height="170" rx="24" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="104" cy="215" r="38" fill="#386377"/><text x="104" y="229" font-size="38" font-weight="800" fill="#fffdf7" text-anchor="middle">1</text><text x="166" y="204" font-size="35" font-weight="800" fill="#272923">お店の材料を書き出す</text><text x="166" y="252" font-size="29" font-weight="400" fill="#64665d">看板商品・こだわり・予定</text><path d="M344 312 L360 336 L376 312 Z" fill="#dd7c43"/><rect x="40" y="348" width="640" height="170" rx="24" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="104" cy="433" r="38" fill="#dd7c43"/><text x="104" y="447" font-size="38" font-weight="800" fill="#fffdf7" text-anchor="middle">2</text><text x="166" y="422" font-size="35" font-weight="800" fill="#272923">AIにネタを30個出す</text><text x="166" y="470" font-size="29" font-weight="400" fill="#64665d">5種類に分けて頼む</text><path d="M344 530 L360 554 L376 530 Z" fill="#dd7c43"/><rect x="40" y="566" width="640" height="170" rx="24" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="104" cy="651" r="38" fill="#386377"/><text x="104" y="665" font-size="38" font-weight="800" fill="#fffdf7" text-anchor="middle">3</text><text x="166" y="640" font-size="35" font-weight="800" fill="#272923">曜日の型に当てはめる</text><text x="166" y="688" font-size="29" font-weight="400" fill="#64665d">日付入りのカレンダーに</text><path d="M344 748 L360 772 L376 748 Z" fill="#dd7c43"/><rect x="40" y="784" width="640" height="170" rx="24" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="104" cy="869" r="38" fill="#dd7c43"/><text x="104" y="883" font-size="38" font-weight="800" fill="#fffdf7" text-anchor="middle">4</text><text x="166" y="858" font-size="35" font-weight="800" fill="#272923">撮影リストでまとめ撮り</text><text x="166" y="906" font-size="29" font-weight="400" fill="#64665d">開店前の30分などに</text></svg>
