<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="窓から光が差すテーブルの料理を、スマートフォンのカメラで撮影しているイラスト">
  <rect width="1200" height="630" fill="#f7f4ec"/>
  <circle cx="1080" cy="80" r="180" fill="#ece8db"/>
  <circle cx="90" cy="580" r="140" fill="#ece8db"/>
  <!-- window -->
  <rect x="90" y="70" width="300" height="320" rx="18" fill="#fffdf7" stroke="#cecec0" stroke-width="6"/>
  <rect x="112" y="92" width="256" height="276" rx="8" fill="#386377" opacity="0.14"/>
  <path d="M240 92 V368 M112 230 H368" stroke="#cecec0" stroke-width="6"/>
  <circle cx="176" cy="160" r="30" fill="#dd7c43" opacity="0.85"/>
  <!-- light beams -->
  <path d="M390 120 L700 330 L700 470 L390 380 Z" fill="#dd7c43" opacity="0.10"/>
  <path d="M390 200 L640 470 L520 470 L390 330 Z" fill="#dd7c43" opacity="0.08"/>
  <!-- table -->
  <rect x="300" y="470" width="760" height="26" rx="13" fill="#386377"/>
  <rect x="360" y="496" width="20" height="120" rx="8" fill="#386377" opacity="0.7"/>
  <rect x="980" y="496" width="20" height="120" rx="8" fill="#386377" opacity="0.7"/>
  <!-- plate & food -->
  <ellipse cx="620" cy="452" rx="170" ry="34" fill="#fffdf7" stroke="#cecec0" stroke-width="4"/>
  <ellipse cx="620" cy="446" rx="118" ry="20" fill="#ece8db"/>
  <path d="M540 440 C 560 380, 680 380, 700 440 Z" fill="#dd7c43"/>
  <circle cx="590" cy="410" r="12" fill="#fffdf7" opacity="0.7"/>
  <circle cx="640" cy="402" r="9" fill="#386377" opacity="0.6"/>
  <circle cx="660" cy="424" r="8" fill="#fffdf7" opacity="0.7"/>
  <!-- steam -->
  <path d="M590 360 c-14 -20 14 -30 0 -50 M630 350 c-14 -20 14 -30 0 -50" fill="none" stroke="#cecec0" stroke-width="6" stroke-linecap="round"/>
  <!-- cup -->
  <rect x="350" y="400" width="64" height="62" rx="12" fill="#fffdf7" stroke="#cecec0" stroke-width="4"/>
  <path d="M414 416 c26 0 26 30 0 30" fill="none" stroke="#cecec0" stroke-width="5"/>
  <!-- phone -->
  <g transform="rotate(-12 930 250)">
    <rect x="820" y="90" width="230" height="330" rx="30" fill="#272923"/>
    <rect x="834" y="108" width="202" height="294" rx="20" fill="#fffdf7"/>
    <rect x="852" y="130" width="166" height="220" rx="10" fill="#ece8db"/>
    <path d="M907 130 V350 M963 130 V350 M852 203 H1018 M852 277 H1018" stroke="#cecec0" stroke-width="2"/>
    <ellipse cx="935" cy="290" rx="60" ry="14" fill="#fffdf7"/>
    <path d="M890 286 C 900 250, 970 250, 980 286 Z" fill="#dd7c43"/>
    <path d="M870 150 h22 M870 150 v22 M1000 150 h-22 M1000 150 v22 M870 330 h22 M870 330 v-22 M1000 330 h-22 M1000 330 v-22" stroke="#386377" stroke-width="4" fill="none"/>
    <circle cx="935" cy="378" r="16" fill="#fffdf7" stroke="#386377" stroke-width="5"/>
  </g>
  <!-- sparkles -->
  <path d="M760 170 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z" fill="#dd7c43"/>
  <path d="M1110 380 l5 11 l11 5 l-11 5 l-5 11 l-5 -11 l-11 -5 l11 -5 z" fill="#386377"/>
</svg>
