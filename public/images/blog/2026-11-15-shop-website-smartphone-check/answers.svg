<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 850" role="img" aria-label="お客様がホームページで探している4つの答え：1 何のお店か（業態・看板メニュー・雰囲気）、2 どこで・いつ開いているか（住所・道順・営業時間・定休日）、3 いくらくらいか（メニューと料金の目安）、4 どうやって予約・連絡するか（予約ページ・電話・LINE）。この4つにスマホで迷わず届くかが大切" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="850" rx="32" fill="#f7f4ec"/>
<text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">お客様が探している4つの答え</text>
<rect x="40" y="112" width="640" height="130" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="108" cy="177" r="38" fill="#386377"/><text x="108" y="192" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">1</text><text x="170" y="168" font-size="35" font-weight="800" fill="#272923">何のお店か</text><text x="170" y="214" font-size="29" fill="#64665d">業態・看板メニュー・雰囲気</text>
<rect x="40" y="258" width="640" height="130" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="108" cy="323" r="38" fill="#386377"/><text x="108" y="338" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">2</text><text x="170" y="314" font-size="35" font-weight="800" fill="#272923">どこで・いつ開いているか</text><text x="170" y="360" font-size="29" fill="#64665d">住所・道順・営業時間・定休日</text>
<rect x="40" y="404" width="640" height="130" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="108" cy="469" r="38" fill="#386377"/><text x="108" y="484" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">3</text><text x="170" y="460" font-size="35" font-weight="800" fill="#272923">いくらくらいか</text><text x="170" y="506" font-size="29" fill="#64665d">メニューと料金の目安</text>
<rect x="40" y="550" width="640" height="130" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="108" cy="615" r="38" fill="#386377"/><text x="108" y="630" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">4</text><text x="170" y="606" font-size="35" font-weight="800" fill="#272923">どうやって予約・連絡するか</text><text x="170" y="652" font-size="29" fill="#64665d">予約ページ・電話・LINE</text>
<rect x="40" y="706" width="640" height="110" rx="22" fill="#dd7c43" fill-opacity="0.14"/><text x="360" y="752" text-anchor="middle" font-size="31" font-weight="700" fill="#272923">この4つに、スマホで</text><text x="360" y="796" text-anchor="middle" font-size="31" font-weight="700" fill="#272923">迷わずたどり着けるか</text>
</svg>
