<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 832" role="img" aria-label="口コミのお願いでやってはいけないことのチェックリスト：割引や特典と引き換えに頼む、満足そうな人だけに頼む、星の数や内容を指定する、低評価を書かないよう頼む、低評価の削除や修正を頼む、スタッフや家族が投稿する。お願いは誰にでも同じように、自然に" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="832" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">お願いでやってはいけないこと</text><rect x="40" y="112" width="640" height="84" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="90" cy="154" r="20" fill="#dd7c43"/><path d="M82 146 l16 16 m0 -16 l-16 16" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><text x="132" y="165" font-size="30" font-weight="700" fill="#272923">割引や特典と引き換えに頼む</text><rect x="40" y="212" width="640" height="84" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="90" cy="254" r="20" fill="#dd7c43"/><path d="M82 246 l16 16 m0 -16 l-16 16" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><text x="132" y="265" font-size="30" font-weight="700" fill="#272923">満足そうな人だけに頼む</text><rect x="40" y="312" width="640" height="84" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="90" cy="354" r="20" fill="#dd7c43"/><path d="M82 346 l16 16 m0 -16 l-16 16" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><text x="132" y="365" font-size="30" font-weight="700" fill="#272923">星の数や内容を指定する</text><rect x="40" y="412" width="640" height="84" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="90" cy="454" r="20" fill="#dd7c43"/><path d="M82 446 l16 16 m0 -16 l-16 16" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><text x="132" y="465" font-size="30" font-weight="700" fill="#272923">低評価を書かないよう頼む</text><rect x="40" y="512" width="640" height="84" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="90" cy="554" r="20" fill="#dd7c43"/><path d="M82 546 l16 16 m0 -16 l-16 16" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><text x="132" y="565" font-size="30" font-weight="700" fill="#272923">低評価の削除・修正を頼む</text><rect x="40" y="612" width="640" height="84" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="90" cy="654" r="20" fill="#dd7c43"/><path d="M82 646 l16 16 m0 -16 l-16 16" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><text x="132" y="665" font-size="30" font-weight="700" fill="#272923">スタッフや家族が投稿する</text><rect x="40" y="716" width="640" height="84" rx="20" fill="#ece8db"/><circle cx="90" cy="758" r="20" fill="#386377"/><path d="M81 758 l7 8 l13 -14" fill="none" stroke="#fffdf7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="132" y="769" font-size="29" font-weight="700" fill="#386377">誰にでも同じように、自然に</text></svg>