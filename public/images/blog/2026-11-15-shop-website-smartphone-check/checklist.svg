<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1014" role="img" aria-label="スマホで5分セルフチェック：最初の画面で何の店か分かる、営業時間と定休日が最新、電話番号をタップで発信できる、住所から地図がすぐ開く、メニューと料金が拡大せず読める、予約ボタンがすぐ見つかる、表示が遅すぎない、Googleマップと情報が同じ" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="1014" rx="32" fill="#f7f4ec"/>
