<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 988" role="img" aria-label="口コミのお願いカードの文例：見出し「ご来店ありがとうございました」、本文「よろしければGoogleマップにご感想をお聞かせください。良かった点も、気になった点もお店づくりの参考にします。」、QRコード、「お時間のあるときで大丈夫です。」。書くときのポイントは、気になった点もと添える、特典や評価の指定は書かない、印刷前にスマホで読み取る" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="988" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">カード・POPの文例</text><rect x="40" y="110" width="640" height="560" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="40" y="110" width="640" height="18" rx="9" fill="#dd7c43"/><text x="360" y="192" text-anchor="middle" font-size="36" font-weight="800" fill="#272923">ご来店ありがとうございました</text><path d="M120 218 h480" stroke="#cecec0" stroke-width="3" stroke-dasharray="6 10"/><text x="84" y="272" font-size="29" fill="#272923">よろしければGoogleマップに</text><text x="84" y="318" font-size="29" fill="#272923">ご感想をお聞かせください。</text><text x="84" y="364" font-size="29" fill="#272923">良かった点も、気になった点も</text><text x="84" y="410" font-size="29" fill="#272923">お店づくりの参考にします。</text><rect x="84" y="452" width="180" height="180" rx="10" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="96.0" y="464.0" width="66.85714285714286" height="66.85714285714286" rx="4" fill="#272923"/><rect x="112.71428571428572" y="480.7142857142857" width="33.42857142857143" height="33.42857142857143" rx="2" fill="#fffdf7"/><rect x="185.14285714285714" y="464.0" width="66.85714285714286" height="66.85714285714286" rx="4" fill="#272923"/><rect x="201.8571428571429" y="480.7142857142857" width="33.42857142857143" height="33.42857142857143" rx="2" fill="#fffdf7"/><rect x="96.0" y="553.1428571428571" width="66.85714285714286" height="66.85714285714286" rx="4" fill="#272923"/><rect x="112.71428571428572" y="569.8571428571429" width="33.42857142857143" height="33.42857142857143" rx="2" fill="#fffdf7"/><rect x="185.14285714285714" y="553.1428571428571" width="17.82857142857143" height="17.82857142857143" rx="2" fill="#386377"/><rect x="207.42857142857142" y="575.4285714285714" width="17.82857142857143" height="17.82857142857143" rx="2" fill="#386377"/><rect x="229.71428571428572" y="553.1428571428571" width="17.82857142857143" height="17.82857142857143" rx="2" fill="#386377"/><rect x="185.14285714285714" y="597.7142857142858" width="17.82857142857143" height="17.82857142857143" rx="2" fill="#386377"/><rect x="229.71428571428572" y="597.7142857142858" width="17.82857142857143" height="17.82857142857143" rx="2" fill="#386377"/><rect x="207.42857142857142" y="542.0" width="17.82857142857143" height="17.82857142857143" rx="2" fill="#386377"/><rect x="174.0" y="575.4285714285714" width="17.82857142857143" height="17.82857142857143" rx="2" fill="#386377"/><text x="300" y="530" font-size="29" font-weight="700" fill="#386377">お時間のあるときで</text><text x="300" y="576" font-size="29" font-weight="700" fill="#386377">大丈夫です。</text><text x="44" y="730" font-size="30" font-weight="800" fill="#386377">書くときのポイント</text><rect x="40" y="760" width="640" height="56" rx="14" fill="#ece8db"/><circle cx="72" cy="788" r="8" fill="#dd7c43"/><text x="96" y="798" font-size="29" fill="#272923">「気になった点も」と添える</text><rect x="40" y="826" width="640" height="56" rx="14" fill="#ece8db"/><circle cx="72" cy="854" r="8" fill="#dd7c43"/><text x="96" y="864" font-size="29" fill="#272923">特典や評価の指定は書かない</text><rect x="40" y="892" width="640" height="56" rx="14" fill="#ece8db"/><circle cx="72" cy="920" r="8" fill="#dd7c43"/><text x="96" y="930" font-size="29" fill="#272923">印刷前にスマホで読み取る</text></svg>