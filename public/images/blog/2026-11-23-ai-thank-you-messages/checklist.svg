<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" role="img" aria-label="送る前のチェックリスト：受け取りを了解した方にだけ送る、お名前と前回の内容が合っている、日付・値段・条件が正しい、お礼のメッセージに宣伝を入れていない、送る回数が決めた上限以内。AIには個人情報を入れない" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="800" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">送る前のチェックリスト</text>
<rect x="40" y="116" width="640" height="86" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="70" y="138" width="42" height="42" rx="10" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M79 159 l10 10 l17 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="170" font-size="31" font-weight="700" fill="#272923">受け取りを了解した方だけ</text>
<rect x="40" y="218" width="640" height="86" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="70" y="240" width="42" height="42" rx="10" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M79 261 l10 10 l17 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="272" font-size="31" font-weight="700" fill="#272923">名前と前回の内容が合っている</text>
<rect x="40" y="320" width="640" height="86" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="70" y="342" width="42" height="42" rx="10" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M79 363 l10 10 l17 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="374" font-size="31" font-weight="700" fill="#272923">日付・値段・条件が正しい</text>
<rect x="40" y="422" width="640" height="86" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="70" y="444" width="42" height="42" rx="10" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M79 465 l10 10 l17 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="476" font-size="31" font-weight="700" fill="#272923">お礼に宣伝を入れていない</text>
<rect x="40" y="524" width="640" height="86" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="70" y="546" width="42" height="42" rx="10" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M79 567 l10 10 l17 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="578" font-size="31" font-weight="700" fill="#272923">送る回数が決めた上限以内</text>
<rect x="40" y="640" width="640" height="124" rx="22" fill="#386377" fill-opacity="0.12"/><text x="360" y="692" text-anchor="middle" font-size="29" fill="#64665d">AIに渡すときも忘れずに</text><text x="360" y="738" text-anchor="middle" font-size="33" font-weight="800" fill="#386377">個人情報は入れない</text></svg>
