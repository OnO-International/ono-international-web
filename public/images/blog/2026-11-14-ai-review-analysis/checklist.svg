<rect x="80" y="552" width="46" height="46" rx="10" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M91 575 l9 10 l18 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="586" font-size="31" font-weight="700" fill="#272923">1件だけの声で決めつけない</text>
