<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1066" role="img" aria-label="口コミをお願いする流れ：1 お客様の満足が伝わる、2 お礼を伝える、3 「よろしければ」を添えてひと言お願いする、4 カードやQRコードを渡して書く場所まで案内する、5 届いたら良い声にも厳しい声にも返信する" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="1066" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">口コミをお願いする流れ</text><rect x="40" y="116" width="640" height="140" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="186" r="40" fill="#386377"/><text x="112" y="201" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">1</text><text x="180" y="178" font-size="35" font-weight="800" fill="#272923">満足が伝わる</text><text x="180" y="224" font-size="29" fill="#64665d">「おいしかった」の声や笑顔</text><path d="M360 266 v20 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="302" width="640" height="140" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="372" r="40" fill="#386377"/><text x="112" y="387" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">2</text><text x="180" y="364" font-size="35" font-weight="800" fill="#272923">お礼を伝える</text><text x="180" y="410" font-size="29" fill="#64665d">来店への感謝をひと言</text><path d="M360 452 v20 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="488" width="640" height="140" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="558" r="40" fill="#dd7c43"/><text x="112" y="573" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">3</text><text x="180" y="550" font-size="35" font-weight="800" fill="#272923">ひと言お願いする</text><text x="180" y="596" font-size="29" fill="#64665d">「よろしければ」を添えて</text><path d="M360 638 v20 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="674" width="640" height="140" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="744" r="40" fill="#386377"/><text x="112" y="759" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">4</text><text x="180" y="736" font-size="35" font-weight="800" fill="#272923">カードやQRを渡す</text><text x="180" y="782" font-size="29" fill="#64665d">書く場所まで案内する</text><path d="M360 824 v20 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="860" width="640" height="140" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="930" r="40" fill="#386377"/><text x="112" y="945" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">5</text><text x="180" y="922" font-size="35" font-weight="800" fill="#272923">届いたら返信する</text><text x="180" y="968" font-size="29" fill="#64665d">良い声にも厳しい声にも</text></svg>