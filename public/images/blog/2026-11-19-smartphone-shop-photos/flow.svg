<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 836" role="img" aria-label="撮影リストを使った写真づくりの流れ：1 AIで撮影リストを作る、2 営業前にまとめて撮る、3 1カット3枚撮って一番いい1枚を選ぶ、4 ホームページやGoogleマップに載せ、SNSや店頭POPにも使い回す" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="836" rx="32" fill="#f7f4ec"/>
<text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">撮影リストで写真づくり</text>
<rect x="40" y="120" width="640" height="136" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="188" r="40" fill="#386377"/><text x="112" y="203" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">1</text><text x="180" y="180" font-size="35" font-weight="800" fill="#272923">AIで撮影リストを作る</text><text x="180" y="226" font-size="29" fill="#64665d">撮るもの・場所・角度を表に</text>
<path d="M360 262 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="300" width="640" height="136" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="368" r="40" fill="#386377"/><text x="112" y="383" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">2</text><text x="180" y="360" font-size="35" font-weight="800" fill="#272923">営業前にまとめて撮る</text><text x="180" y="406" font-size="29" fill="#64665d">明るい時間に照明もつけて</text>
<path d="M360 442 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="480" width="640" height="136" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="548" r="40" fill="#386377"/><text x="112" y="563" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">3</text><text x="180" y="540" font-size="35" font-weight="800" fill="#272923">1カット3枚から選ぶ</text><text x="180" y="586" font-size="29" fill="#64665d">角度を少しずつ変えて撮る</text>
<path d="M360 622 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="660" width="640" height="136" rx="26" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="112" cy="728" r="40" fill="#dd7c43"/><text x="112" y="743" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">4</text><text x="180" y="720" font-size="35" font-weight="800" fill="#272923">HPやマップに載せる</text><text x="180" y="766" font-size="29" fill="#64665d">SNSや店頭POPにも使い回す</text>
</svg>
