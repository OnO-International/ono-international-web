<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" role="img" aria-label="口コミ整理のチェックリスト：投稿者の名前を消した、口コミに番号を付けた、AIの結果を原文で確かめた、件数は「目安」として見た、1件だけの声で決めつけない、口コミ本文を転載していない、行動は1つに絞った" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="880" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="38" font-weight="800" fill="#272923">口コミ整理のチェックリスト</text><rect x="40" y="112" width="640" height="728" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/>
