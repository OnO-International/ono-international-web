<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" role="img" aria-label="初めての人がプロフィールで見る順番：1 名前とアイコンで何の店か、2 紹介文で場所と営業時間、3 ハイライトでメニューと雰囲気、4 リンクやボタンで予約と行き方" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="780" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="38" font-weight="800" fill="#272923">初めての人が見る順番</text><rect x="40" y="116" width="640" height="124" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="178" r="38" fill="#386377"/><text x="112" y="193" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">1</text><text x="180" y="170" font-size="35" font-weight="800" fill="#272923">名前とアイコン</text><text x="180" y="214" font-size="29" fill="#64665d">何のお店か分かるか</text><path d="M360 246 v22 m-15 -13 l15 15 l15 -15" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="280" width="640" height="124" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="342" r="38" fill="#386377"/><text x="112" y="357" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">2</text><text x="180" y="334" font-size="35" font-weight="800" fill="#272923">紹介文</text><text x="180" y="378" font-size="29" fill="#64665d">どこで、いつ開いている？</text><path d="M360 410 v22 m-15 -13 l15 15 l15 -15" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="444" width="640" height="124" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="506" r="38" fill="#386377"/><text x="112" y="521" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">3</text><text x="180" y="498" font-size="35" font-weight="800" fill="#272923">ハイライト</text><text x="180" y="542" font-size="29" fill="#64665d">メニュー・料金と雰囲気</text><path d="M360 574 v22 m-15 -13 l15 15 l15 -15" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="608" width="640" height="124" rx="26" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="112" cy="670" r="38" fill="#dd7c43"/><text x="112" y="685" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">4</text><text x="180" y="662" font-size="35" font-weight="800" fill="#272923">リンク・ボタン</text><text x="180" y="706" font-size="29" fill="#64665d">予約の方法と行き方</text></svg>
