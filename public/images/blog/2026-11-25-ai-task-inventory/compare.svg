<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1110" role="img" aria-label="仕事の書き出し方の比較：「事務作業」より「予約メッセージに返信する、1日15分・店長」。「SNS」より「投稿文を考えて打つ、週3回・1回20分」。「発注」より「発注メモを清書して送る、毎朝10分・店長」" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="1110" rx="32" fill="#f7f4ec"/>
<text x="360" y="72" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">仕事の書き出し方を比べる</text>
