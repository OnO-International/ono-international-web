<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 914" width="720" height="914" role="img" aria-label="FAQができるまでの4ステップ：1 質問を集める、2 答えの事実を書き出す、3 AIで下書き（推測しないよう指示）、4 人が読み直して確認してから公開" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="914" rx="32" fill="#f7f4ec"/><text x="360" y="80" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">FAQができるまでの4ステップ</text><rect x="40" y="124" width="640" height="150" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="199" r="40" fill="#386377"/><text x="112" y="214" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">1</text><text x="180" y="192" font-size="35" font-weight="800" fill="#272923">質問を集める</text><text x="180" y="240" font-size="29" fill="#64665d">1週間、聞かれたことをメモ</text><path d="M360 284 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="324" width="640" height="150" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="399" r="40" fill="#386377"/><text x="112" y="414" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">2</text><text x="180" y="392" font-size="35" font-weight="800" fill="#272923">答えの事実を書き出す</text><text x="180" y="440" font-size="29" fill="#64665d">駐車場・支払い・予約の決まり</text><path d="M360 484 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="524" width="640" height="150" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="599" r="40" fill="#386377"/><text x="112" y="614" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">3</text><text x="180" y="592" font-size="35" font-weight="800" fill="#272923">AIで下書き</text><text x="180" y="640" font-size="29" fill="#64665d">推測しないよう指示する</text><path d="M360 684 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="724" width="640" height="150" rx="26" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="112" cy="799" r="40" fill="#dd7c43"/><text x="112" y="814" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">4</text><text x="180" y="792" font-size="35" font-weight="800" fill="#272923">確認して公開</text><text x="180" y="840" font-size="29" fill="#64665d">人が読み直してから載せる</text></svg>