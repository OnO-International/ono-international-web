<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 782" role="img" aria-label="低評価の口コミへの返信の順番：1 お礼、2 お詫び、3 確認できた事実と改善、4 必要なら連絡窓口の案内。反論しない、言い訳しない、確認できていない事実は認めも否定もしない" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="782" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">低評価への返信の順番</text><rect x="40" y="116" width="640" height="96" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="98" cy="164" r="30" fill="#386377"/><text x="98" y="177" text-anchor="middle" font-size="34" font-weight="800" fill="#fffdf7">1</text><text x="148" y="177" font-size="34" font-weight="800" fill="#272923">来店と口コミへのお礼</text><rect x="40" y="230" width="640" height="96" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="98" cy="278" r="30" fill="#386377"/><text x="98" y="291" text-anchor="middle" font-size="34" font-weight="800" fill="#fffdf7">2</text><text x="148" y="291" font-size="34" font-weight="800" fill="#272923">ご不便・ご不快へのお詫び</text><rect x="40" y="344" width="640" height="96" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="98" cy="392" r="30" fill="#386377"/><text x="98" y="405" text-anchor="middle" font-size="34" font-weight="800" fill="#fffdf7">3</text><text x="148" y="405" font-size="34" font-weight="800" fill="#272923">確認できた事実と、今後の改善</text><rect x="40" y="458" width="640" height="96" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="98" cy="506" r="30" fill="#386377"/><text x="98" y="519" text-anchor="middle" font-size="34" font-weight="800" fill="#fffdf7">4</text><text x="148" y="519" font-size="34" font-weight="800" fill="#272923">必要なら、直接の連絡窓口を案内</text><rect x="40" y="580" width="640" height="170" rx="22" fill="#dd7c43" fill-opacity="0.14"/><text x="360" y="636" text-anchor="middle" font-size="31" font-weight="700" fill="#272923">反論しない・言い訳しない</text><text x="360" y="682" text-anchor="middle" font-size="31" font-weight="700" fill="#272923">確認できていない事実は</text><text x="360" y="728" text-anchor="middle" font-size="31" font-weight="700" fill="#272923">認めも否定もしない</text></svg>
