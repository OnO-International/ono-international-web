<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 730" role="img" aria-label="写真の印象を決める3つのポイント：光は窓からの自然光を横か斜め後ろから当てる、角度は料理は斜め上・平皿は真上・店内は目線の高さ、背景は伝票や私物を片付けて主役以外を画面から外す" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="730" rx="32" fill="#f7f4ec"/>
<text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">写真の印象を決める3つ</text>
<rect x="40" y="120" width="640" height="172" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="114" cy="206" r="44" fill="#dd7c43"/><circle cx="114" cy="206" r="16" fill="#fffdf7"/><rect x="111" y="172" width="6" height="12" rx="3" fill="#fffdf7" transform="rotate(0 114 206)"/><rect x="111" y="172" width="6" height="12" rx="3" fill="#fffdf7" transform="rotate(45 114 206)"/><rect x="111" y="172" width="6" height="12" rx="3" fill="#fffdf7" transform="rotate(90 114 206)"/><rect x="111" y="172" width="6" height="12" rx="3" fill="#fffdf7" transform="rotate(135 114 206)"/><rect x="111" y="172" width="6" height="12" rx="3" fill="#fffdf7" transform="rotate(180 114 206)"/><rect x="111" y="172" width="6" height="12" rx="3" fill="#fffdf7" transform="rotate(225 114 206)"/><rect x="111" y="172" width="6" height="12" rx="3" fill="#fffdf7" transform="rotate(270 114 206)"/><rect x="111" y="172" width="6" height="12" rx="3" fill="#fffdf7" transform="rotate(315 114 206)"/><text x="186" y="178" font-size="37" font-weight="800" fill="#386377">光</text><text x="186" y="224" font-size="29" fill="#272923">窓からの自然光で撮る</text><text x="186" y="264" font-size="29" fill="#64665d">横か斜め後ろから当てる</text>
<rect x="40" y="316" width="640" height="172" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="114" cy="402" r="44" fill="#386377"/><path d="M92 422 h44 M92 422 l30 -36" fill="none" stroke="#fffdf7" stroke-width="6" stroke-linecap="round"/><path d="M116 422 a24 24 0 0 0 -8 -18" fill="none" stroke="#fffdf7" stroke-width="4"/><text x="186" y="374" font-size="37" font-weight="800" fill="#386377">角度</text><text x="186" y="420" font-size="29" fill="#272923">料理は斜め上・平皿は真上</text><text x="186" y="460" font-size="29" fill="#64665d">店内は目線の高さで</text>
<rect x="40" y="512" width="640" height="172" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="114" cy="598" r="44" fill="#386377"/><rect x="92" y="580" width="44" height="36" rx="6" fill="none" stroke="#fffdf7" stroke-width="5"/><circle cx="114" cy="598" r="8" fill="#dd7c43"/><text x="186" y="570" font-size="37" font-weight="800" fill="#386377">背景</text><text x="186" y="616" font-size="29" fill="#272923">伝票や私物を片付ける</text><text x="186" y="656" font-size="29" fill="#64665d">主役以外を画面から外す</text>
</svg>
