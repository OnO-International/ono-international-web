<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1110" role="img" aria-label="よくある書き方とおすすめの書き方の比較：「丁寧にご案内する」より「目を合わせて、何名様かうかがう」。「早めに片付ける」より「お客様が帰ったら、すぐテーブルを拭く」。「困ったら相談する」より「アレルギーの質問は、自分で答えず店長を呼ぶ」" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="1110" rx="32" fill="#f7f4ec"/>
<text x="360" y="72" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">よくある書き方とおすすめ</text>
<circle cx="200" cy="124" r="14" fill="#64665d"/><text x="224" y="134" font-size="29" fill="#64665d">よくある例</text><circle cx="412" cy="124" r="14" fill="#dd7c43"/><text x="436" y="134" font-size="29" fill="#64665d">おすすめ例</text>
<text x="40" y="206" font-size="35" font-weight="800" fill="#386377">ご案内</text>
<rect x="40" y="226" width="640" height="76" rx="20" fill="#ece8db"/><circle cx="84" cy="264" r="22" fill="#64665d"/><path d="M75 255 l18 18 m0 -18 l-18 18" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><text x="124" y="274" font-size="29" fill="#64665d">丁寧にご案内する</text>
<rect x="40" y="314" width="640" height="120" rx="20" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="84" cy="374" r="22" fill="#dd7c43"/><path d="M74 374 l7 8 l14 -15" fill="none" stroke="#fffdf7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="364" font-size="29" font-weight="700" fill="#272923">目を合わせて、</text><text x="124" y="406" font-size="29" font-weight="700" fill="#272923">何名様かうかがう</text>
<text x="40" y="516" font-size="35" font-weight="800" fill="#386377">片付け</text>
<rect x="40" y="536" width="640" height="76" rx="20" fill="#ece8db"/><circle cx="84" cy="574" r="22" fill="#64665d"/><path d="M75 565 l18 18 m0 -18 l-18 18" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><text x="124" y="584" font-size="29" fill="#64665d">早めに片付ける</text>
<rect x="40" y="624" width="640" height="120" rx="20" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="84" cy="684" r="22" fill="#dd7c43"/><path d="M74 684 l7 8 l14 -15" fill="none" stroke="#fffdf7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="674" font-size="29" font-weight="700" fill="#272923">お客様が帰ったら、</text><text x="124" y="716" font-size="29" font-weight="700" fill="#272923">すぐテーブルを拭く</text>
<text x="40" y="826" font-size="35" font-weight="800" fill="#386377">困ったとき</text>
<rect x="40" y="846" width="640" height="76" rx="20" fill="#ece8db"/><circle cx="84" cy="884" r="22" fill="#64665d"/><path d="M75 875 l18 18 m0 -18 l-18 18" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><text x="124" y="894" font-size="29" fill="#64665d">困ったら相談する</text>
<rect x="40" y="934" width="640" height="120" rx="20" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="84" cy="994" r="22" fill="#dd7c43"/><path d="M74 994 l7 8 l14 -15" fill="none" stroke="#fffdf7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="984" font-size="29" font-weight="700" fill="#272923">アレルギーの質問は、</text><text x="124" y="1026" font-size="29" font-weight="700" fill="#272923">自分で答えず店長を呼ぶ</text>
</svg>
