<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" role="img" aria-label="伝わるPOPの3つのパーツ：1 ひと言（目を止める短い言葉）、2 説明（具体的な中身を1〜2行）、3 行動（価格・時間・頼み方）。事実をひとつ入れるのがコツ" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="860" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">伝わるPOPの3つのパーツ</text>
<rect x="40" y="120" width="640" height="600" rx="26" fill="#fffdf7" stroke="#dd7c43" stroke-width="5"/><circle cx="360" cy="152" r="12" fill="#f7f4ec" stroke="#dd7c43" stroke-width="4"/>
<rect x="76" y="190" width="568" height="150" rx="20" fill="#ece8db"/><circle cx="140" cy="265" r="38" fill="#dd7c43"/><text x="140" y="280" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">1</text><text x="200" y="252" font-size="37" font-weight="800" fill="#272923">ひと言</text><text x="200" y="300" font-size="29" fill="#64665d">目を止める短い言葉</text>
<rect x="76" y="360" width="568" height="150" rx="20" fill="#ece8db"/><circle cx="140" cy="435" r="38" fill="#386377"/><text x="140" y="450" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">2</text><text x="200" y="422" font-size="37" font-weight="800" fill="#272923">説明</text><text x="200" y="470" font-size="29" fill="#64665d">具体的な中身を1〜2行</text>
<rect x="76" y="530" width="568" height="150" rx="20" fill="#ece8db"/><circle cx="140" cy="605" r="38" fill="#386377"/><text x="140" y="620" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">3</text><text x="200" y="592" font-size="37" font-weight="800" fill="#272923">行動</text><text x="200" y="640" font-size="29" fill="#64665d">価格・時間・頼み方</text>
<rect x="40" y="750" width="640" height="76" rx="38" fill="#386377"/><text x="360" y="800" text-anchor="middle" font-size="31" font-weight="800" fill="#fffdf7">事実をひとつ入れるのがコツ</text></svg>
