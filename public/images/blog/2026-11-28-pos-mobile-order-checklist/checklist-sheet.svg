<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" role="img" aria-label="比較チェック表の書き方の例。行に5項目、列に自店の答え・A社・B社を並べ、空欄に聞いた答えを書き込む" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="840" rx="32" fill="#f7f4ec"/><text x="360" y="72" text-anchor="middle" font-size="38" font-weight="800" fill="#272923">答えを1枚に書き込む</text><rect x="30" y="110" width="660" height="580" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="30" y="110" width="660" height="60" rx="20" fill="#386377"/><rect x="30" y="150" width="660" height="20" fill="#386377"/><text x="150" y="152" text-anchor="middle" font-size="30" font-weight="800" fill="#fffdf7">項目</text><text x="340" y="152" text-anchor="middle" font-size="30" font-weight="800" fill="#fffdf7">自店</text><text x="480" y="152" text-anchor="middle" font-size="30" font-weight="800" fill="#fffdf7">A社</text><text x="620" y="152" text-anchor="middle" font-size="30" font-weight="800" fill="#fffdf7">B社</text><text x="48" y="234" font-size="29" font-weight="700" fill="#272923">① 注文方法</text><rect x="284" y="192" width="112" height="60" rx="10" fill="#ece8db"/><rect x="424" y="192" width="112" height="60" rx="10" fill="#ece8db"/><rect x="564" y="192" width="112" height="60" rx="10" fill="#ece8db"/><line x1="30" y1="274" x2="690" y2="274" stroke="#cecec0" stroke-width="3"/><text x="48" y="338" font-size="29" font-weight="700" fill="#272923">② 変更・取消</text><rect x="284" y="296" width="112" height="60" rx="10" fill="#ece8db"/><rect x="424" y="296" width="112" height="60" rx="10" fill="#ece8db"/><rect x="564" y="296" width="112" height="60" rx="10" fill="#ece8db"/><line x1="30" y1="378" x2="690" y2="378" stroke="#cecec0" stroke-width="3"/><text x="48" y="442" font-size="29" font-weight="700" fill="#272923">③ 通信・厨房</text><rect x="284" y="400" width="112" height="60" rx="10" fill="#ece8db"/><rect x="424" y="400" width="112" height="60" rx="10" fill="#ece8db"/><rec