<rect x="40" y="310" width="640" height="170" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/>
<circle cx="110" cy="395" r="44" fill="#dd7c43"/>
<path d="M88 378 h26 l22 17 l-22 17 h-26 z" fill="#fffdf7"/>
<circle cx="98" cy="395" r="5" fill="#dd7c43"/>
