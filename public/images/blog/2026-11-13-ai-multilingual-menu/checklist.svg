<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1016" width="720" height="1016" role="img" aria-label="外国語メニュー公開前のチェックリスト：価格が日本語メニューと同じ、[CHECK]が残っていない、料理名の横に日本語もある、豚肉・お酒などを明記した、Halalなどを根拠なく書かない、逆翻訳で意味を確かめた、アレルギーの案内文がある、スマホで見て読める大きさ" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="1016" rx="32" fill="#f7f4ec"/><text x="360" y="80" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">公開前チェックリスト</text><rect x="40" y="124" width="640" height="852" rx="28" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="72" y="164" width="44" height="44" rx="10" fill="none" stroke="#386377" stroke-width="4"/><path d="M82 186 l10 10 l18 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="196" font-size="29" font-weight="700" fill="#272923">価格が日本語メニューと同じ</text><line x1="72" y1="238" x2="648" y2="238" stroke="#ece8db" stroke-width="3"/><rect x="72" y="268" width="44" height="44" rx="10" fill="none" stroke="#386377" stroke-width="4"/><path d="M82 290 l10 10 l18 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="300" font-size="29" font-weight="700" fill="#272923">[CHECK]が残っていない</text><line x1="72" y1="342" x2="648" y2="342" stroke="#ece8db" stroke-width="3"/><rect x="72" y="372" width="44" height="44" rx="10" fill="none" stroke="#386377" stroke-width="4"/><path d="M82 394 l10 10 l18 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="404" font-size="29" font-weight="700" fill="#272923">料理名の横に日本語もある</text><line x1="72" y1="446" x2="648" y2="446" stroke="#ece8db" stroke-width="3"/><rect x="72" y="476" width="44" height="44" rx="10" fill="none" stroke="#386377" stroke-width="4"/><path d="M82 498 l10 10 l18 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-line