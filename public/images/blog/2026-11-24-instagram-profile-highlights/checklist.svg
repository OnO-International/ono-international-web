<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" role="img" aria-label="プロフィール見直しチェックリスト：名前とアイコンで何の店か分かる、紹介文に場所と営業時間がある、最後の行で次の行動を案内している、ハイライトに予約とアクセスがある、古い情報のストーリーズを外した、リンクと連絡先が正しく動く。月に1回、初めての人のつもりで見る" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="880" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="38" font-weight="800" fill="#272923">プロフィール見直しチェック</text><rect x="40" y="116" width="640" height="86" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="70" y="138" width="42" height="42" rx="10" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M79 159 l10 10 l17 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="170" font-size="31" font-weight="700" fill="#272923">名前とアイコンで何の店か</text><rect x="40" y="218" width="640" height="86" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="70" y="240" width="42" height="42" rx="10" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M79 261 l10 10 l17 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="272" font-size="31" font-weight="700" fill="#272923">紹介文に場所と営業時間</text><rect x="40" y="320" width="640" height="86" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="70" y="342" width="42" height="42" rx="10" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M79 363 l10 10 l17 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="374" font-size="31" font-weight="700" fill="#272923">最後の行で次の行動を案内</text><rect x="40" y="422" width="640" height="86" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="70" y="444" width="42" height="42" rx="10" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M79 465 l10 10 l17 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="476" font-size="31" font-weight="700" fill="#272923">ハイライトに予約・アクセス</text><rect x="40" y="524" width="640" height="86" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="70" y="546" width="42" height="42" rx="10" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M79 567 l10 10 l17 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="578" font-size="31" font-weight="700" fill="#272923">古いストーリーズを外した</text><rect x="40" y="626" width="640" height="86" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="70" y="648" width="42" height="42" rx="10" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M79 669 l10 10 l17 -20" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="680" font-size="31" font-weight="700" fill="#272923">リンクと連絡先が正しく動く</text><rect x="40" y="734" width="640" height="118" rx="22" fill="#386377" fill-opacity="0.12"/><text x="360" y="782" text-anchor="middle" font-size="29" fill="#64665d">月に1回はこの目線で</text><text x="360" y="828" text-anchor="middle" font-size="33" font-weight="800" fill="#386377">初めての人のつもりで見る</text></svg>
