<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-label="お礼・再来店メッセージを送る3つのタイミング：1 来店当日〜翌日はお礼（宣伝は入れず感謝だけ）、2 次回の目安の少し前は再来店の案内（前回のメニューから時期を決める）、3 季節の変わり目は季節の便り（季節のメニューや年末の予約など）" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="720" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">送る3つのタイミング</text><path d="M100 190 V590" stroke="#cecec0" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round"/><rect x="40" y="120" width="640" height="150" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="100" cy="195" r="36" fill="#386377"/><text x="100" y="209" text-anchor="middle" font-size="38" font-weight="800" fill="#fffdf7">1</text><text x="160" y="186" font-size="35" font-weight="800" fill="#272923">お礼<tspan font-size="29" font-weight="700" fill="#386377" dx="14">来店当日〜翌日</tspan></text><text x="160" y="236" font-size="29" fill="#64665d">宣伝は入れず、感謝だけを伝える</text><rect x="40" y="320" width="640" height="150" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="100" cy="395" r="36" fill="#386377"/><text x="100" y="409" text-anchor="middle" font-size="38" font-weight="800" fill="#fffdf7">2</text><text x="160" y="386" font-size="35" font-weight="800" fill="#272923">再来店の案内<tspan font-size="29" font-weight="700" fill="#386377" dx="14">目安の少し前</tspan></text><text x="160" y="436" font-size="29" fill="#64665d">前回のメニューから時期を決める</text><rect x="40" y="520" width="640" height="150" rx="26" fill="#fffdf7" stroke="#dd7c43" stroke-width="4"/><circle cx="100" cy="595" r="36" fill="#dd7c43"/><text x="100" y="609" text-anchor="middle" font-size="38" font-weight="800" fill="#fffdf7">3</text><text x="160" y="586" font-size="35" font-weight="800" fill="#272923">季節の便り<tspan font-size="29" font-weight="700" fill="#dd7c43" dx="14">季節の変わり目</tspan></text><text x="160" y="636" font-size="29" fill="#64665d">季節のメニューや年末の予約など</text></svg>
