<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-label="口コミ返信をAIで下書きする3ステップ：1 返信ルールを作る、2 口コミとルールをAIに渡す、3 読み直して自分の言葉を足す" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="720" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">AIで下書きする3ステップ</text><rect x="40" y="120" width="640" height="150" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="195" r="40" fill="#386377"/><text x="112" y="210" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">1</text><text x="180" y="188" font-size="35" font-weight="800" fill="#272923">返信ルールを作る</text><text x="180" y="236" font-size="29" fill="#64665d">トーン・長さ・呼び方を5行ほどに</text><path d="M360 280 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="320" width="640" height="150" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="395" r="40" fill="#386377"/><text x="112" y="410" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">2</text><text x="180" y="388" font-size="35" font-weight="800" fill="#272923">口コミとルールをAIに渡す</text><text x="180" y="436" font-size="29" fill="#64665d">具体的な内容に触れるよう指示する</text><path d="M360 480 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="520" width="640" height="150" rx="26" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="112" cy="595" r="40" fill="#dd7c43"/><text x="112" y="610" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">3</text><text x="180" y="588" font-size="35" font-weight="800" fill="#272923">読み直して、ひと言足す</text><text x="180" y="636" font-size="29" fill="#64665d">事実確認と送信は必ず人が行う</text></svg>
