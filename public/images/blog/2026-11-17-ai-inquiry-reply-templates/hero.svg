  <path d="M178 134 h176 a16 16 0 0 1 16 16 v46 a16 16 0 0 1 -16 16 h-150 l-18 16 v-16 h-8 a16 16 0 0 1 -16 -16 v-46 a16 16 0 0 1 16 -16 z" fill="#ece8db"/>
  <rect x="196" y="156" width="140" height="12" rx="6" fill="#64665d" opacity="0.45"/>
  <rect x="196" y="180" width="100" height="12" rx="6" fill="#64665d" opacity="0.45"/>
  <path d="M178 250 h150 a16 16 0 0 1 16 16 v40 a16 16 0 0 1 -16 16 h-124 l-18 16 v-16 h-8 a16 16 0 0 1 -16 -16 v-40 a16 16 0 0 1 16 -16 z" fill="#ece8db"/>
  <rect x="196" y="272" width="118" height="12" rx="6" fill="#64665d" opacity="0.45"/>
  <rect x="196" y="294" width="80" height="12" rx="6" fill="#64665d" opacity="0.45"/>
  <!-- outgoing reply bubble -->
  <path d="M232 376 h158 a16 16 0 0 1 16 16 v78 a16 16 0 0 1 -16 16 h-8 v16 l-18 -16 h-132 a16 16 0 0 1 -16 -16 v-78 a16 16 0 0 1 16 -16 z" fill="#386377"/>
  <rect x="250" y="398" width="130" height="12" rx="6" fill="#fffdf7" opacity="0.85"/>
  <rect x="250" y="422" width="110" height="12" rx="6" fill="#fffdf7" opacity="0.85"/>
  <rect x="250" y="446" width="120" height="12" rx="6" fill="#fffdf7" opacity="0.85"/>
  <circle cx="400" cy="372" r="22" fill="#dd7c43"/>
  <path d="M389 372 l8 8 l14 -15" fill="none" stroke="#fffdf7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrow from cards to phone -->
  <path d="M640 330 C 580 380, 530 400, 478 400" fill="none" stroke="#386377" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"/>
  <path d="M496 382 L 474 400 L 496 418" fill="none" stroke="#386377" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- template cards stack -->
  <rect x="720" y="110" width="380" height="120" rx="24" fill="#fffdf7" stroke="#cecec0" stroke-width="3" transform="rotate(-4 910 170)"/>
  <rect x="690" y="210" width="400" height="130" rx="24" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/>
  <rect x="660" y="320" width="420" height="160" rx="26" fill="#fffdf7" stroke="#386377" stroke-width="4"/>
  <!-- card1 calendar icon -->
  <g transform="rotate(-4 910 170)">
    <rect x="750" y="136" width="56" height="56" rx="10" fill="#386377" opacity="0.2"/>
    <rect x="750" y="136" width="56" height="16" rx="8" fill="#386377"/>
    <rect x="826" y="146" width="210" height="14" rx="7" fill="#cecec0"/>
    <rect x="826" y="172" width="160" height="14" rx="7" fill="#cecec0"/>
  </g>
  <!-- card2 envelope icon -->
  <rect x="720" y="242" width="60" height="44" rx="8" fill="#dd7c43" opacity="0.25"/>
  <path d="M722 246 l28 22 l28 -22" fill="none" stroke="#dd7c43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="802" y="246" width="230" height="14" rx="7" fill="#cecec0"/>
  <rect x="802" y="272" width="170" height="14" rx="7" fill="#cecec0"/>
  <!-- card3 active template -->
  <circle cx="712" cy="372" r="28" fill="#386377"/>
  <path d="M712 354 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5 z" fill="#fffdf7"/>
  <rect x="758" y="362" width="160" height="18" rx="9" fill="#386377" opacity="0.25"/>
  <rect x="694" y="414" width="90" height="16" rx="8" fill="#cecec0"/>
  <rect x="794" y="410" width="88" height="24" rx="8" fill="#dd7c43" opacity="0.3" stroke="#dd7c43" stroke-width="3" stroke-dasharray="6 5"/>
  <rect x="892" y="414" width="150" height="16" rx="8" fill="#cecec0"/>
  <rect x="694" y="446" width="230" height="16" rx="8" fill="#cecec0"/>
  <rect x="934" y="442" width="88" height="24" rx="8" fill="#dd7c43" opacity="0.3" stroke="#dd7c43" stroke-width="3" stroke-dasharray="6 5"/>
</svg>
