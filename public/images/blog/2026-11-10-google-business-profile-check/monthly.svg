<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 892" role="img" aria-label="月1回の見直しの流れ：1 検索して表示を確認（お客様と同じ目線で）、2 営業時間を更新（翌月の特別営業時間も）、3 写真を1枚以上追加（季節メニューや新商品）、4 口コミを確認して返信（届いた口コミに目を通す）。毎月決まった日に予定へ入れる" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="892" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">月1回の見直しの流れ</text><rect x="40" y="116" width="640" height="120" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="96" cy="176" r="32" fill="#386377"/><text x="96" y="188" text-anchor="middle" font-size="35" font-weight="800" fill="#fffdf7">1</text><text x="150" y="168" font-size="33" font-weight="800" fill="#272923">検索して表示を確認</text><text x="150" y="212" font-size="29" fill="#64665d">お客様と同じ目線で</text><path d="M360 244 v20 m-14 -12 l14 14 l14 -14" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="276" width="640" height="120" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="96" cy="336" r="32" fill="#386377"/><text x="96" y="348" text-anchor="middle" font-size="35" font-weight="800" fill="#fffdf7">2</text><text x="150" y="328" font-size="33" font-weight="800" fill="#272923">営業時間を更新</text><text x="150" y="372" font-size="29" fill="#64665d">翌月の特別営業時間も</text><path d="M360 404 v20 m-14 -12 l14 14 l14 -14" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="436" width="640" height="120" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="96" cy="496" r="32" fill="#386377"/><text x="96" y="508" text-anchor="middle" font-size="35" font-weight="800" fill="#fffdf7">3</text><text x="150" y="488" font-size="33" font-weight="800" fill="#272923">写真を1枚以上追加</text><text x="150" y="532" font-size="29" fill="#64665d">季節メニューや新商品</text><path d="M360 564 v20 m-14 -12 l14 14 l14 -14" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="596" width="640" height="120" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="96" cy="656" r="32" fill="#386377"/><text x="96" y="668" text-anchor="middle" font-size="35" font-weight="800" fill="#fffdf7">4</text><text x="150" y="648" font-size="33" font-weight="800" fill="#272923">口コミを確認して返信</text><text x="150" y="692" font-size="29" fill="#64665d">届いた口コミに目を通す</text><rect x="40" y="752" width="640" height="100" rx="22" fill="#386377"/><text x="360" y="814" text-anchor="middle" font-size="33" font-weight="800" fill="#fffdf7">毎月決まった日に予定へ</text></svg>
