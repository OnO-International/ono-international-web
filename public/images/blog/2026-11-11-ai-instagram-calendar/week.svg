<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 908" width="720" height="908" role="img" aria-label="週3回投稿の型の例：月曜は商品・メニュー（例 看板メニューの断面）、水曜は作り手・こだわり（例 朝の仕込みの手元）、金曜はお知らせ・週末の案内（例 週末の限定品、定休日）。月に1回はお客様に役立つお役立ち情報を入れる" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="908" rx="32" fill="#f7f4ec"/><text x="360" y="82" font-size="40" font-weight="800" fill="#272923" text-anchor="middle">週3回投稿の型（例）</text><rect x="40" y="128" width="640" height="160" rx="24" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="64" y="158" width="100" height="100" rx="20" fill="#386377"/><text x="114" y="224" font-size="44" font-weight="800" fill="#fffdf7" text-anchor="middle">月</text><text x="192" y="198" font-size="35" font-weight="800" fill="#272923">商品・メニュー</text><text x="192" y="246" font-size="29" font-weight="400" fill="#64665d">例：看板メニューの断面</text><rect x="40" y="308" width="640" height="160" rx="24" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="64" y="338" width="100" height="100" rx="20" fill="#386377"/><text x="114" y="404" font-size="44" font-weight="800" fill="#fffdf7" text-anchor="middle">水</text><text x="192" y="378" font-size="35" font-weight="800" fill="#272923">作り手・こだわり</text><text x="192" y="426" font-size="29" font-weight="400" fill="#64665d">例：朝の仕込みの手元</text><rect x="40" y="488" width="640" height="160" rx="24" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="64" y="518" width="100" height="100" rx="20" fill="#dd7c43"/><text x="114" y="584" font-size="44" font-weight="800" fill="#fffdf7" text-anchor="middle">金</text><text x="192" y="558" font-size="35" font-weight="800" fill="#272923">お知らせ・週末の案内</text><text x="192" y="606" font-size="29" font-weight="400" fill="#64665d">例：週末の限定品、定休日</text><rect x="40" y="678" width="640" height="190" rx="24" fill="#ece8db"/><rect x="64" y="708" width="64" height="58" rx="10" fill="#fffdf7" stroke="#386377" stroke-width="4"/><rect x="64" y="708" width="64" height="16" rx="6" fill="#386377"/><circle cx="96" cy="746" r="8" fill="#dd7c43"/><text x="150" y="750" font-size="35" font-weight="800" fill="#272923">月1回はお役立ち情報</text><text x="64" y="810" font-size="29" font-weight="400" fill="#272923">例：パンの上手な温め直し方</text><text x="64" y="848" font-size="29" font-weight="400" fill="#64665d">季節や暮らしに役立つ話題を選ぶ</text></svg>
