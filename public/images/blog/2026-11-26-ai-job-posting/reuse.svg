<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" width="720" role="img" aria-label="1つの求人原稿から4つの場所へ展開する流れ：求人サイト（詳しい条件まで）、ホームページの採用ページ（写真と1日の流れ）、Instagram（短く・写真つき）、店頭の貼り紙（大きな字で5行）。条件は原文から変えない" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="860" rx="32" fill="#f7f4ec"/>
<text x="360" y="78" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">1つの原稿を使い回す</text>
<rect x="160" y="118" width="400" height="120" rx="24" fill="#386377"/><rect x="196" y="146" width="48" height="64" rx="6" fill="#fffdf7"/><path d="M206 166 h28 M206 180 h28 M206 194 h18" stroke="#386377" stroke-width="4" stroke-linecap="round"/><text x="394" y="192" text-anchor="middle" font-size="36" font-weight="800" fill="#fffdf7">元の求人原稿</text>
<path d="M360 238 v40 M190 278 h340 M190 278 v28 M530 278 v28" fill="none" stroke="#386377" stroke-width="5" stroke-linecap="round"/><path d="M178 296 l12 14 l12 -14 M518 296 l12 14 l12 -14" fill="none" stroke="#386377" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="290" y="254" width="140" height="48" rx="24" fill="#dd7c43"/><path d="M330 266 l4 8 l8 4 l-8 4 l-4 8 l-4 -8 l-8 -4 l8 -4 z" fill="#fffdf7"/><text x="350" y="289" font-size="29" font-weight="800" fill="#fffdf7">AI</text>
<rect x="40" y="330" width="300" height="150" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><text x="190" y="394" text-anchor="middle" font-size="32" font-weight="800" fill="#272923">求人サイト</text><text x="190" y="442" text-anchor="middle" font-size="29" fill="#64665d">詳しい条件まで</text>
<rect x="380" y="330" width="300" height="150" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><text x="530" y="394" text-anchor="middle" font-size="32" font-weight="800" fill="#272923">採用ページ</text><text x="530" y="442" text-anchor="middle" font-size="29" fill="#64665d">写真と1日の流れ</text>
<rect x="40" y="510" width="300" height="150" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><text x="190" y="574" text-anchor="middle" font-size="32" font-weight="800" fill="#272923">Instagram</text><text x="190" y="622" text-anchor="middle" font-size="29" fill="#64665d">短く・写真つき</text>
<rect x="380" y="510" width="300" height="150" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><text x="530" y="574" text-anchor="middle" font-size="32" font-weight="800" fill="#272923">店頭の貼り紙</text><text x="530" y="622" text-anchor="middle" font-size="29" fill="#64665d">大きな字で5行</text>
<rect x="40" y="700" width="640" height="110" rx="22" fill="#dd7c43" fill-opacity="0.14"/><text x="360" y="750" text-anchor="middle" font-size="31" font-weight="700" fill="#272923">給与・時間などの条件は</text><text x="360" y="792" text-anchor="middle" font-size="31" font-weight="700" fill="#272923">原文から変えない</text>
</svg>
