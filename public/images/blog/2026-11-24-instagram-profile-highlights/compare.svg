<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" role="img" aria-label="よくある紹介文とおすすめの紹介文の比較。よくある例は「スイーツ大好き店主の日常。ゆるっと更新中」で、場所も時間も分からない。おすすめ例は「〇〇駅3分の洋菓子店、焼き菓子と季節のタルト、11〜18時・火水休み、予約と地図は下のリンクから」で、何の店・場所・時間・次の行動がそろっている" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="800" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="38" font-weight="800" fill="#272923">紹介文、どう書く？</text><rect x="40" y="116" width="640" height="232" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="70" y="140" width="190" height="50" rx="25" fill="#ece8db"/><text x="165" y="175" text-anchor="middle" font-size="29" font-weight="700" fill="#64665d">よくある例</text><text x="80" y="236" font-size="31" font-weight="700" fill="#272923">スイーツ大好き店主の日常。</text><text x="80" y="280" font-size="31" font-weight="700" fill="#272923">ゆるっと更新中</text><text x="80" y="326" font-size="29" fill="#64665d">→ 場所も時間も分からない</text><path d="M360 362 v30 m-18 -16 l18 18 l18 -18" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="408" width="640" height="360" rx="26" fill="#fffdf7" stroke="#386377" stroke-width="4"/><rect x="70" y="432" width="220" height="50" rx="25" fill="#386377"/><text x="180" y="467" text-anchor="middle" font-size="29" font-weight="700" fill="#fffdf7">おすすめ例</text><text x="80" y="530" font-size="31" font-weight="700" fill="#272923">〇〇駅3分の洋菓子店</text><text x="80" y="574" font-size="31" font-weight="700" fill="#272923">焼き菓子と季節のタルト</text><text x="80" y="618" font-size="31" font-weight="700" fill="#272923">11〜18時・火水休み</text><text x="80" y="662" font-size="31" font-weight="700" fill="#272923">予約と地図は下のリンクから</text><rect x="70" y="688" width="580" height="54" rx="16" fill="#dd7c43" fill-opacity="0.14"/><text x="360" y="725" text-anchor="middle" font-size="29" font-weight="700" fill="#272923">何の店・場所・時間・次の行動</text></svg>
