<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" aria-label="POPの文章をAIで作る4ステップ：1 商品の事実を書き出す、2 AIに3パーツで案を出してもらう、3 声に出して読み、短く削る、4 書いて貼り、写真を撮って残す" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="920" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">AIでPOPを作る4ステップ</text>
<rect x="40" y="120" width="640" height="150" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="195" r="40" fill="#386377"/><text x="112" y="210" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">1</text><text x="180" y="188" font-size="35" font-weight="800" fill="#272923">商品の事実を書き出す</text><text x="180" y="236" font-size="29" fill="#64665d">素材・量・期間・価格をメモ</text>
<path d="M360 280 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="320" width="640" height="150" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="395" r="40" fill="#386377"/><text x="112" y="410" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">2</text><text x="180" y="388" font-size="35" font-weight="800" fill="#272923">3パーツで案を出してもらう</text><text x="180" y="436" font-size="29" fill="#64665d">書かれていないことは書かない</text>
<path d="M360 480 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="520" width="640" height="150" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="595" r="40" fill="#386377"/><text x="112" y="610" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">3</text><text x="180" y="588" font-size="35" font-weight="800" fill="#272923">声に出して読み、削る</text><text x="180" y="636" font-size="29" fill="#64665d">ふだんの言葉に置き換える</text>
<path d="M360 680 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="720" width="640" height="150" rx="26" fill="#fffdf7" stroke="#386377" stroke-width="3"/><circle cx="112" cy="795" r="40" fill="#dd7c43"/><text x="112" y="810" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">4</text><text x="180" y="788" font-size="35" font-weight="800" fill="#272923">書いて貼り、写真に残す</text><text x="180" y="836" font-size="29" fill="#64665d">来年の同じ季節に見直せる</text>
</svg>
