<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 958" role="img" aria-label="障害時から復旧後までの流れ：1 止まったら紙伝票に切り替えて注文を受ける、2 復旧後、受付済み・送信待ちの注文と紙伝票を照らし合わせる、3 未登録と確認できた分だけ担当者が登録する、判断できない注文は入力を止めて確認する、4 締めで照合する" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="958" rx="32" fill="#f7f4ec"/><text x="360" y="72" text-anchor="middle" font-size="36" font-weight="800" fill="#272923">止まったとき・戻ったときの流れ</text><rect x="40" y="120" width="640" height="118" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="96" cy="179" r="32" fill="#386377"/><text x="96" y="191" text-anchor="middle" font-size="34" font-weight="800" fill="#fffdf7">1</text><text x="146" y="170" font-size="29" font-weight="700" fill="#272923">止まったら紙伝票に</text><text x="146" y="212" font-size="29" font-weight="700" fill="#272923">切り替えて注文を受ける</text><path d="M360 246 v24 m-14 -12 l14 14 l14 -14" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="312" text-anchor="middle" font-size="29" font-weight="800" fill="#64665d">― 復旧したら ―</text><rect x="40" y="334" width="640" height="118" rx="22" fill="#fffdf7" stroke="#dd7c43" stroke-width="4"/><circle cx="96" cy="393" r="32" fill="#dd7c43"/><text x="96" y="405" text-anchor="middle" font-size="34" font-weight="800" fill="#fffdf7">2</text><text x="146" y="384" font-size="29" font-weight="700" fill="#272923">受付済み・送信待ちの注文と</text><text x="146" y="426" font-size="29" font-weight="700" fill="#272923">紙伝票を照らし合わせる</text><path d="M360 460 v24 m-14 -12 l14 14 l14 -14" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="496" width="640" height="118" rx="22" fill="#fffdf7" stroke="#dd7c43" stroke-width="4"/><circle cx="96" cy="555" r="32" fill="#dd7c43"/><text x="96" y="567" text-anchor="middle" font-size="34" font-weight="800" fill="#fffdf7">3</text><text x="146" y="546" font-size="29" font-weight="700" fill="#272923">未登録と確認できた分だけ</text><text x="146" y="588" font-size="29" font-weight="700" fill="#272923">担当者が登録する</text><path d="M120 614 v30" fill="none" stroke="#dd7c43" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/><rect x="80" y="644" width="600" height="112" rx="20" fill="#ece8db" stroke="#dd7c43" stroke-width="3"/><text x="110" y="690" font-size="29" font-weight="800" fill="#dd7c43">判断できない注文は</text><text x="110" y="732" font-size="29" font-weight="700" fill="#272923">入力を止めて、確認してから</text><path d="M360 764 v24 m-14 -12 l14 14 l14 -14" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="800" width="640" height="118" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="96" cy="859" r="32" fill="#386377"/><text x="96" y="871" text-anchor="middle" font-size="34" font-weight="800" fill="#fffdf7">4</text><text x="146" y="870" font-size="31" font-weight="700" fill="#272923">締めで照合する</text></svg>