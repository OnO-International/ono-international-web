<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 856" role="img" aria-label="よくある声かけとおすすめの声かけの比較：評価のお願いは「星5つでお願いします」より「よろしければご感想を」。書いてもらう時は「今ここで書いてください」より「お時間のあるときに」。見返りは「書いたら次回10%オフ」ではなく「率直なご感想で大丈夫です」" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="856" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">よくある声かけとおすすめ</text><text x="44" y="142" font-size="30" font-weight="800" fill="#386377">評価のお願い</text><rect x="40" y="160" width="640" height="76" rx="18" fill="#ece8db"/><circle cx="80" cy="198" r="20" fill="#64665d"/><path d="M72 190 l16 16 m0 -16 l-16 16" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><text x="114" y="208" font-size="29" fill="#64665d">「星5つでお願いします」</text><rect x="40" y="248" width="640" height="76" rx="18" fill="#fffdf7" stroke="#dd7c43" stroke-width="4"/><circle cx="80" cy="286" r="20" fill="#dd7c43"/><path d="M71 286 l7 8 l13 -14" fill="none" stroke="#fffdf7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="296" font-size="29" font-weight="700" fill="#272923">「よろしければご感想を」</text><text x="44" y="388" font-size="30" font-weight="800" fill="#386377">書いてもらう時</text><rect x="40" y="406" width="640" height="76" rx="18" fill="#ece8db"/><circle cx="80" cy="444" r="20" fill="#64665d"/><path d="M72 436 l16 16 m0 -16 l-16 16" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><text x="114" y="454" font-size="29" fill="#64665d">「今ここで書いてください」</text><rect x="40" y="494" width="640" height="76" rx="18" fill="#fffdf7" stroke="#dd7c43" stroke-width="4"/><circle cx="80" cy="532" r="20" fill="#dd7c43"/><path d="M71 532 l7 8 l13 -14" fill="none" stroke="#fffdf7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="542" font-size="29" font-weight="700" fill="#272923">「お時間のあるときに」</text><text x="44" y="634" font-size="30" font-weight="800" f