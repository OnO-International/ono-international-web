<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 910" width="720" height="910" role="img" aria-label="外国語メニューをAIで作る4ステップ：1 日本語の元原稿を整える（料理名・説明・食材・税込価格）、2 AIに訳してもらう（推測しないよう指示）、3 別の会話で日本語に戻して確かめる、4 スタッフと確認して紙・Web・店頭の案内に載せる" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="910" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">外国語メニュー 4ステップ</text><rect x="40" y="120" width="640" height="150" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="195" r="40" fill="#386377"/><text x="112" y="210" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">1</text><text x="180" y="188" font-size="35" font-weight="800" fill="#272923">日本語の元原稿を整える</text><text x="180" y="236" font-size="29" fill="#64665d">料理名・説明・食材・税込価格</text><path d="M360 280 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="320" width="640" height="150" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="395" r="40" fill="#386377"/><text x="112" y="410" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">2</text><text x="180" y="388" font-size="35" font-weight="800" fill="#272923">AIに訳してもらう</text><text x="180" y="436" font-size="29" fill="#64665d">推測しないよう指示する</text><path d="M360 480 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="520" width="640" height="150" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="595" r="40" fill="#386377"/><text x="112" y="610" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">3</text><text x="180" y="588" font-size="35" font-weight="800" fill="#272923">日本語に戻して確かめる</text><text x="180" y="636" font-size="29" fill="#64665d">別の会話で「逆翻訳」</text><path d="M360 680 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="720" width="640" height="150" rx="26" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="112" cy="795" r="40" fill="#dd7c43"/><text x="112" y="810" text-anchor="middle" font-size="42" font-weight="800" fill="#fffdf7">4</text><text x="180" y="788" font-size="35" font-weight="800" fill="#272923">スタッフと確認して載せる</text><text x="180" y="836" font-size="29" fill="#64665d">紙・Web・店頭の案内に</text></svg>