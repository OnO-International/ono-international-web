<path d="M360 480 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="520" width="640" height="150" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="112" cy="595" r="40" fill="#386377"/><text x="112" y="610" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">3</text><text x="180" y="588" font-size="35" font-weight="800" fill="#272923">原文で確かめる</text><text x="180" y="636" font-size="29" fill="#64665d">番号をたどって読み直す</text>
