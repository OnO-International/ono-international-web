<text x="180" y="412" font-size="29" fill="#272923">セールやサービスを伝える</text>
<text x="180" y="452" font-size="29" fill="#64665d">タイトルと期間が必要</text>
<rect x="40" y="500" width="640" height="170" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/>
<circle cx="110" cy="585" r="44" fill="#386377"/>
