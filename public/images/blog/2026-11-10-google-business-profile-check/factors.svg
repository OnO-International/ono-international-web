<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 744" role="img" aria-label="Googleマップの表示に関わる3つの要素：関連性（検索した言葉と情報が合うか、整えられる）、距離（探す人からどれだけ近いか、変えられない）、知名度（口コミやWebでの知られ方、少しずつ育つ）。お店がまず整えられるのは、正しく詳しい情報" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="744" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">表示に関わる3つの要素</text><rect x="40" y="116" width="640" height="136" rx="20" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="100" cy="184" r="38" fill="#386377"/><circle cx="96" cy="180" r="16" fill="none" stroke="#fffdf7" stroke-width="6"/><path d="M108 192 l12 12" stroke="#fffdf7" stroke-width="7" stroke-linecap="round"/><text x="160" y="174" font-size="35" font-weight="800" fill="#272923">関連性</text><rect x="452" y="138" width="206" height="46" rx="23" fill="none" stroke="#dd7c43" stroke-width="3"/><text x="555" y="171" text-anchor="middle" font-size="29" font-weight="700" fill="#dd7c43">整えられる</text><text x="160" y="224" font-size="29" fill="#64665d">検索した言葉と情報が合うか</text><rect x="40" y="268" width="640" height="136" rx="20" fill="#ece8db" stroke="#cecec0" stroke-width="3"/><circle cx="100" cy="336" r="38" fill="#64665d"/><path d="M100 360 C 78 336, 80 314, 100 314 C 120 314, 122 336, 100 360 Z" fill="#fffdf7"/><circle cx="100" cy="332" r="7" fill="#64665d"/><text x="160" y="326" font-size="35" font-weight="800" fill="#272923">距離</text><rect x="452" y="290" width="206" height="46" rx="23" fill="none" stroke="#64665d" stroke-width="3"/><text x="555" y="323" text-anchor="middle" font-size="29" font-weight="700" fill="#64665d">変えられない</text><text x="160" y="376" font-size="29" fill="#64665d">探す人からどれだけ近いか</text><rect x="40" y="420" width="640" height="136" rx="20" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="100" cy="488" r="38" fill="#386377"/><path d="M100 466 L106.5 481 L122 482 L110 493 L114 509 L100 500 L86 509 L90 493 L78 482 L93.5 481 Z" fill="#fffdf7"/><text x="160" y="478" font-size="35" font-weight="800" fill="#272923">知名度</text><rect x="452" y="442" width="206" height="46" rx="23" fill="none" stroke="#dd7c43" stroke-width="3"/><text x="555" y="475" text-anchor="middle" font-size="29" font-weight="700" fill="#dd7c43">少しずつ育つ</text><text x="160" y="528" font-size="29" fill="#64665d">口コミやWebでの知られ方</text><rect x="40" y="580" width="640" height="124" rx="22" fill="#386377"/><text x="360" y="632" text-anchor="middle" font-size="31" font-weight="700" fill="#fffdf7">お店がまず整えられるのは</text><text x="360" y="680" text-anchor="middle" font-size="35" font-weight="800" fill="#fffdf7">正しく詳しい情報</text></svg>
