<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 890" role="img" aria-label="1枚マニュアルの4つの欄：1 場面（いつ・どこで使うか）、2 手順（番号つきで順番に）、3 言い方の例（お客様へのひと言）、4 困ったとき（自分で判断しないこと）" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="890" rx="32" fill="#f7f4ec"/>
<text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">1枚マニュアルの4つの欄</text>
<rect x="40" y="120" width="640" height="150" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="40" y="120" width="14" height="150" rx="7" fill="#386377"/><circle cx="104" cy="195" r="32" fill="#386377"/><text x="104" y="207" text-anchor="middle" font-size="35" font-weight="800" fill="#fffdf7">1</text><text x="158" y="184" font-size="36" font-weight="800" fill="#272923">場面</text><text x="158" y="234" font-size="29" fill="#64665d">いつ・どこで使うかを書く</text>
<rect x="40" y="290" width="640" height="150" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="40" y="290" width="14" height="150" rx="7" fill="#386377"/><circle cx="104" cy="365" r="32" fill="#386377"/><text x="104" y="377" text-anchor="middle" font-size="35" font-weight="800" fill="#fffdf7">2</text><text x="158" y="354" font-size="36" font-weight="800" fill="#272923">手順</text><text x="158" y="404" font-size="29" fill="#64665d">番号つきで上から順に書く</text>
<rect x="40" y="460" width="640" height="150" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="40" y="460" width="14" height="150" rx="7" fill="#386377"/><circle cx="104" cy="535" r="32" fill="#386377"/><text x="104" y="547" text-anchor="middle" font-size="35" font-weight="800" fill="#fffdf7">3</text><text x="158" y="524" font-size="36" font-weight="800" fill="#272923">言い方の例</text><text x="158" y="574" font-size="29" fill="#64665d">お客様へのひと言をそのまま</text>
<rect x="40" y="630" width="640" height="150" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="40" y="630" width="14" height="150" rx="7" fill="#dd7c43"/><circle cx="104" cy="705" r="32" fill="#dd7c43"/><text x="104" y="717" text-anchor="middle" font-size="35" font-weight="800" fill="#fffdf7">4</text><text x="158" y="694" font-size="36" font-weight="800" fill="#272923">困ったとき</text><text x="158" y="744" font-size="29" fill="#64665d">自分で判断しないことを書く</text>
<text x="360" y="848" text-anchor="middle" font-size="29" font-weight="700" fill="#386377">1つの場面につき、1枚でOK</text></svg>
