<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-label="予約・問い合わせの返信の4つのパーツ：1 お礼（連絡へのお礼をひと言）、2 答え（聞かれたことに結論から）、3 確認（日時・人数を復唱する）、4 次の行動（してほしいことを示す）" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="900" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">返信は4つのパーツで</text>
<g>
<rect x="40" y="120" width="310" height="290" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="100" cy="182" r="34" fill="#386377"/><text x="100" y="196" text-anchor="middle" font-size="38" font-weight="800" fill="#fffdf7">1</text><text x="150" y="196" font-size="36" font-weight="800" fill="#272923">お礼</text><rect x="70" y="236" width="250" height="4" rx="2" fill="#ece8db"/><text x="70" y="298" font-size="29" fill="#64665d">連絡へのお礼を</text><text x="70" y="342" font-size="29" fill="#64665d">ひと言</text>
<rect x="370" y="120" width="310" height="290" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="430" cy="182" r="34" fill="#386377"/><text x="430" y="196" text-anchor="middle" font-size="38" font-weight="800" fill="#fffdf7">2</text><text x="480" y="196" font-size="36" font-weight="800" fill="#272923">答え</text><rect x="400" y="236" width="250" height="4" rx="2" fill="#ece8db"/><text x="400" y="298" font-size="29" fill="#64665d">聞かれたことに</text><text x="400" y="342" font-size="29" fill="#64665d">結論から</text>
<rect x="40" y="430" width="310" height="290" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="100" cy="492" r="34" fill="#386377"/><text x="100" y="506" text-anchor="middle" font-size="38" font-weight="800" fill="#fffdf7">3</text><text x="150" y="506" font-size="36" font-weight="800" fill="#272923">確認</text><rect x="70" y="546" width="250" height="4" rx="2" fill="#ece8db"/><text x="70" y="608" font-size="29" fill="#64665d">日時・人数を</text><text x="70" y="652" font-size="29" fill="#64665d">復唱する</text>
<rect x="370" y="430" width="310" height="290" rx="26" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="430" cy="492" r="34" fill="#dd7c43"/><text x="430" y="506" text-anchor="middle" font-size="38" font-weight="800" fill="#fffdf7">4</text><text x="480" y="506" font-size="36" font-weight="800" fill="#272923">次の行動</text><rect x="400" y="546" width="250" height="4" rx="2" fill="#ece8db"/><text x="400" y="608" font-size="29" fill="#64665d">してほしいこと</text><text x="400" y="652" font-size="29" fill="#64665d">を示す</text>
</g>
<rect x="40" y="750" width="640" height="110" rx="22" fill="#386377" fill-opacity="0.12"/><text x="360" y="796" text-anchor="middle" font-size="30" font-weight="700" fill="#272923">毎回変わる日時や人数は</text><text x="360" y="838" text-anchor="middle" font-size="30" font-weight="700" fill="#386377">〔 〕の空欄にしておく</text></svg>
