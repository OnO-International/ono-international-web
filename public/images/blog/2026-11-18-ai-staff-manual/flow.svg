<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 850" role="img" aria-label="AIでマニュアルを作る3ステップ：1 いつもの手順を声に出してメモする、2 AIに1枚の手順書に整えてもらう、3 新人さんに試してもらい直す" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="850" rx="32" fill="#f7f4ec"/>
<text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">マニュアルを作る3ステップ</text>
<rect x="40" y="120" width="640" height="160" rx="22" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="104" cy="200" r="34" fill="#386377"/><text x="104" y="213" text-anchor="middle" font-size="36" font-weight="800" fill="#fffdf7">1</text><text x="160" y="190" font-size="35" font-weight="800" fill="#272923">いつもの手順を声でメモ</text><text x="160" y="240" font-size="29" fill="#64665d">作業しながら音声入力で</text>
<path d="M360 290 V 328" stroke="#dd7c43" stroke-width="6" stroke-linecap="round"/><path d="M342 312 L360 330 L378 312" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="340" width="640" height="160" rx="22" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="104" cy="420" r="34" fill="#386377"/><text x="104" y="433" text-anchor="middle" font-size="36" font-weight="800" fill="#fffdf7">2</text><text x="160" y="410" font-size="35" font-weight="800" fill="#272923">AIに1枚に整えてもらう</text><text x="160" y="460" font-size="29" fill="#64665d">4つの欄と条件を伝える</text>
<path d="M360 510 V 548" stroke="#dd7c43" stroke-width="6" stroke-linecap="round"/><path d="M342 532 L360 550 L378 532" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="560" width="640" height="160" rx="22" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="104" cy="640" r="34" fill="#386377"/><text x="104" y="653" text-anchor="middle" font-size="36" font-weight="800" fill="#fffdf7">3</text><text x="160" y="630" font-size="35" font-weight="800" fill="#272923">新人さんに試してもらう</text><text x="160" y="680" font-size="29" fill="#64665d">つまずいた所を書き足す</text>
<rect x="40" y="754" width="640" height="64" rx="18" fill="#ece8db"/><text x="360" y="796" text-anchor="middle" font-size="29" font-weight="700" fill="#386377">直したら、またAIに書き直してもらう</text></svg>
