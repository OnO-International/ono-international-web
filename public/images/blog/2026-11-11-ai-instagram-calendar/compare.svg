<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1072" width="720" height="1072" role="img" aria-label="よくある例とおすすめ例の比較：AIへの頼み方は「おしゃれな投稿文を書いて」より店名・ネタ・伝えたいこと・長さを伝える。投稿文の中身は「最高においしい！」より「朝7時に焼き上がります」と事実を書く。仕上げはAIの文をそのまま投稿するより、自分のひと言を1文足す" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="1072" rx="32" fill="#f7f4ec"/><text x="360" y="82" font-size="40" font-weight="800" fill="#272923" text-anchor="middle">よくある例とおすすめ例</text><rect x="40" y="116" width="10" height="38" rx="5" fill="#dd7c43"/><text x="64" y="148" font-size="35" font-weight="800" fill="#272923">AIへの頼み方</text><rect x="40" y="170" width="640" height="108" rx="20" fill="#ece8db"/><path d="M64 192 l20 20 m0 -20 l-20 20" stroke="#64665d" stroke-width="5" stroke-linecap="round"/><text x="98" y="212" font-size="29" font-weight="700" fill="#64665d">よくある例</text><text x="64" y="258" font-size="29" font-weight="400" fill="#64665d">「おしゃれな投稿文を書いて」</text><rect x="40" y="290" width="640" height="108" rx="20" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="74" cy="322" r="11" fill="none" stroke="#dd7c43" stroke-width="5"/><text x="98" y="332" font-size="29" font-weight="800" fill="#dd7c43">おすすめ</text><text x="64" y="378" font-size="29" font-weight="700" fill="#272923">店名・ネタ・伝えたいこと・長さ</text><rect x="40" y="432" width="10" height="38" rx="5" fill="#dd7c43"/><text x="64" y="464" font-size="35" font-weight="800" fill="#272923">投稿文の中身</text><rect x="40" y="486" width="640" height="108" rx="20" fill="#ece8db"/><path d="M64 508 l20 20 m0 -20 l-20 20" stroke="#64665d" stroke-width="5" stroke-linecap="round"/><text x="98" y="528" font-size="29" font-weight="700" fill="#64665d">よくある例</text><text x="64" y="574" font-size="29" font-weight="400" fill="#64665d">「最高においしい！」</text><rect x="40" y="606" width="640" height="108" rx="20" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="74" cy="638" r="11" fill="none" stroke="#dd7c43" stroke-width="5"/><text x="98" y="648" font-size="29" font-weight="800" fill="#dd7c43">おすすめ</text><text x="64" y="694" font-size="29" font-weight="700" fill="#272923">「朝7時に焼き上がります」</text><rect x="40" y="748" width="10" height="38" rx="5" fill="#dd7c43"/><text x="64" y="780" font-size="35" font-weight="800" fill="#272923">仕上げ</text><rect x="40" y="802" width="640" height="108" rx="20" fill="#ece8db"/><path d="M64 824 l20 20 m0 -20 l-20 20" stroke="#64665d" stroke-width="5" stroke-linecap="round"/><text x="98" y="844" font-size="29" font-weight="700" fill="#64665d">よくある例</text><text x="64" y="890" font-size="29" font-weight="400" fill="#64665d">AIの文をそのまま投稿</text><rect x="40" y="922" width="640" height="108" rx="20" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="74" cy="954" r="11" fill="none" stroke="#dd7c43" stroke-width="5"/><text x="98" y="964" font-size="29" font-weight="800" fill="#dd7c43">おすすめ</text><text x="64" y="1010" font-size="29" font-weight="700" fill="#272923">自分のひと言を1文足す</text></svg>
