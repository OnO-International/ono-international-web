<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 830" role="img" aria-label="AIにお客様役で読んでもらう流れ：1 ページの文章をコピー（個人情報は貼らない）、2 初めてのお客様役で読んでもらう、3 分からない点を挙げてもらう（推測しないよう指示）、4 直す順番を決める（間違い、連絡手段、最初の一文の順）" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="830" rx="32" fill="#f7f4ec"/>
<text x="360" y="76" text-anchor="middle" font-size="38" font-weight="800" fill="#272923">AIにお客様役で読んでもらう</text>
<rect x="40" y="120" width="640" height="130" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="108" cy="185" r="38" fill="#386377"/><text x="108" y="200" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">1</text><text x="170" y="176" font-size="35" font-weight="800" fill="#272923">ページの文章をコピー</text><text x="170" y="222" font-size="29" fill="#64665d">個人情報は貼らない</text>
<path d="M360 260 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="300" width="640" height="130" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="108" cy="365" r="38" fill="#386377"/><text x="108" y="380" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">2</text><text x="170" y="356" font-size="35" font-weight="800" fill="#272923">初めてのお客様役で読む</text><text x="170" y="402" font-size="29" fill="#64665d">探している人を具体的に</text>
<path d="M360 440 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="480" width="640" height="130" rx="26" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="108" cy="545" r="38" fill="#386377"/><text x="108" y="560" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">3</text><text x="170" y="536" font-size="35" font-weight="800" fill="#272923">分からない点を挙げてもらう</text><text x="170" y="582" font-size="29" fill="#64665d">推測しないよう指示する</text>
<path d="M360 620 v26 m-16 -14 l16 16 l16 -16" fill="none" stroke="#dd7c43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="660" width="640" height="130" rx="26" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="108" cy="725" r="38" fill="#dd7c43"/><text x="108" y="740" text-anchor="middle" font-size="40" font-weight="800" fill="#fffdf7">4</text><text x="170" y="716" font-size="35" font-weight="800" fill="#272923">直す順番を決める</text><text x="170" y="762" font-size="29" fill="#64665d">間違い→連絡手段→最初の一文</text>
</svg>
