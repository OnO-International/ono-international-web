<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" role="img" aria-label="撮影前のチェックリスト：レンズを拭いた、窓からの光が入る時間に撮る、店内の照明をすべてつけた、テーブルや棚の上を片付けた、お客様や通行人が写らない、写るスタッフの了承を得た" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="800" rx="32" fill="#f7f4ec"/>
<text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">撮影前のチェックリスト</text>
<rect x="40" y="120" width="640" height="92" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="66" y="146" width="40" height="40" rx="8" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M74 166 l9 10 l18 -22" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="177" font-size="29" fill="#272923">レンズを拭いた</text>
<rect x="40" y="228" width="640" height="92" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="66" y="254" width="40" height="40" rx="8" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M74 274 l9 10 l18 -22" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="285" font-size="29" fill="#272923">窓からの光が入る時間に撮る</text>
<rect x="40" y="336" width="640" height="92" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="66" y="362" width="40" height="40" rx="8" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M74 382 l9 10 l18 -22" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="393" font-size="29" fill="#272923">店内の照明をすべてつけた</text>
<rect x="40" y="444" width="640" height="92" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="66" y="470" width="40" height="40" rx="8" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M74 490 l9 10 l18 -22" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="501" font-size="29" fill="#272923">テーブルや棚の上を片付けた</text>
<rect x="40" y="552" width="640" height="92" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="66" y="578" width="40" height="40" rx="8" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M74 598 l9 10 l18 -22" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="609" font-size="29" fill="#272923">お客様や通行人が写らない</text>
<rect x="40" y="660" width="640" height="92" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="66" y="686" width="40" height="40" rx="8" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M74 706 l9 10 l18 -22" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="717" font-size="29" fill="#272923">写るスタッフの了承を得た</text>
</svg>
