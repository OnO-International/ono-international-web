<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 910" role="img" aria-label="口コミを読み解く4ステップ：1 口コミを集めて名前を消す（最近の20〜30件に番号を振る）、2 AIに仕分けてもらう（強みと不満を最大5つずつ）、3 原文で確かめる（番号をたどって読み直す）、4 行動を1つ決める（強みは発信、不満は改善へ）" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="910" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">口コミを読み解く4ステップ</text>
