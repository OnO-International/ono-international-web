<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" role="img" aria-label="POPを貼る前のチェックリスト：価格は税込の総額で書いてある、期間や数量の限定は今も合っている、根拠のないNo.1や日本一がない、アレルギーなど聞かれたら答えられる、離れた所から読める文字の大きさ、終わった企画のPOPが残っていない" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="860" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">POPを貼る前のチェック</text>
<rect x="40" y="120" width="640" height="92" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="66" y="146" width="40" height="40" rx="8" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M74 166 l9 10 l18 -22" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="177" font-size="29" fill="#272923">価格は税込の総額で書いてある</text>
<rect x="40" y="228" width="640" height="92" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="66" y="254" width="40" height="40" rx="8" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M74 274 l9 10 l18 -22" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="285" font-size="29" fill="#272923">期間・数量の限定は今も合っている</text>
<rect x="40" y="336" width="640" height="92" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="66" y="362" width="40" height="40" rx="8" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M74 382 l9 10 l18 -22" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="393" font-size="29" fill="#272923">根拠のない「No.1」「日本一」がない</text>
<rect x="40" y="444" width="640" height="92" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="66" y="470" width="40" height="40" rx="8" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M74 490 l9 10 l18 -22" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="501" font-size="29" fill="#272923">アレルギー等を聞かれたら答えられる</text>
<rect x="40" y="552" width="640" height="92" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="66" y="578" width="40" height="40" rx="8" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M74 598 l9 10 l18 -22" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="609" font-size="29" fill="#272923">離れた所から読める文字の大きさ</text>
<rect x="40" y="660" width="640" height="92" rx="20" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><rect x="66" y="686" width="40" height="40" rx="8" fill="#fffdf7" stroke="#386377" stroke-width="4"/><path d="M74 706 l9 10 l18 -22" fill="none" stroke="#dd7c43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="717" font-size="29" fill="#272923">終わった企画のPOPが残っていない</text>
<text x="360" y="814" text-anchor="middle" font-size="29" font-weight="700" fill="#386377">貼る前と、月に1回の見直しで</text></svg>
