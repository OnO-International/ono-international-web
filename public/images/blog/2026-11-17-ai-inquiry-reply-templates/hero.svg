<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="スマートフォンに届いた予約や問い合わせのメッセージに、AIで用意した返信テンプレートのカードを選んで返しているイラスト">
  <rect width="1200" height="630" fill="#f7f4ec"/>
  <circle cx="1080" cy="560" r="200" fill="#ece8db"/>
  <circle cx="110" cy="80" r="150" fill="#ece8db"/>
  <path d="M0 500 C 220 450, 460 540, 720 490 S 1060 450, 1200 500 L1200 630 L0 630 Z" fill="#386377" opacity="0.08"/>
  <!-- phone -->
  <rect x="140" y="60" width="300" height="510" rx="38" fill="#272923"/>
  <rect x="156" y="82" width="268" height="466" rx="26" fill="#fffdf7"/>
  <rect x="245" y="92" width="90" height="10" rx="5" fill="#cecec0"/>
