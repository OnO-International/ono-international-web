<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" width="720" role="img" aria-label="想像できる言葉の5つの手がかり：1 味・香り（甘い・酸っぱい・香ばしい）、2 食感・手ざわり（ほろほろ・もっちり・さらさら）、3 温度・量・大きさ（熱々・ひと口サイズ）、4 素材・作り方（何を、どう作ったか）、5 合う人・合う場面（どんな時に選ぶとよいか）。1品につき2〜3個を選ぶ" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="920" rx="32" fill="#f7f4ec"/>
<text x="360" y="76" text-anchor="middle" font-size="38" font-weight="800" fill="#272923">想像できる言葉の5つの手がかり</text>
<rect x="40" y="120" width="640" height="120" rx="24" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="106" cy="180" r="36" fill="#386377"/><text x="106" y="194" text-anchor="middle" font-size="38" font-weight="800" fill="#fffdf7">1</text><text x="170" y="172" font-size="35" font-weight="800" fill="#272923">味・香り</text><text x="170" y="216" font-size="29" fill="#64665d">甘い・酸っぱい・香ばしい</text>
<rect x="40" y="256" width="640" height="120" rx="24" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="106" cy="316" r="36" fill="#386377"/><text x="106" y="330" text-anchor="middle" font-size="38" font-weight="800" fill="#fffdf7">2</text><text x="170" y="308" font-size="35" font-weight="800" fill="#272923">食感・手ざわり</text><text x="170" y="352" font-size="29" fill="#64665d">ほろほろ・もっちり・さらさら</text>
<rect x="40" y="392" width="640" height="120" rx="24" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="106" cy="452" r="36" fill="#386377"/><text x="106" y="466" text-anchor="middle" font-size="38" font-weight="800" fill="#fffdf7">3</text><text x="170" y="444" font-size="35" font-weight="800" fill="#272923">温度・量・大きさ</text><text x="170" y="488" font-size="29" fill="#64665d">熱々・ひと口サイズ</text>
<rect x="40" y="528" width="640" height="120" rx="24" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="106" cy="588" r="36" fill="#386377"/><text x="106" y="602" text-anchor="middle" font-size="38" font-weight="800" fill="#fffdf7">4</text><text x="170" y="580" font-size="35" font-weight="800" fill="#272923">素材・作り方</text><text x="170" y="624" font-size="29" fill="#64665d">何を、どう作ったか</text>
<rect x="40" y="664" width="640" height="120" rx="24" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="106" cy="724" r="36" fill="#386377"/><text x="106" y="738" text-anchor="middle" font-size="38" font-weight="800" fill="#fffdf7">5</text><text x="170" y="716" font-size="35" font-weight="800" fill="#272923">合う人・合う場面</text><text x="170" y="760" font-size="29" fill="#64665d">どんな時に選ぶとよいか</text>
<rect x="130" y="812" width="460" height="72" rx="36" fill="#dd7c43"/><text x="360" y="859" text-anchor="middle" font-size="32" font-weight="800" fill="#fffdf7">1品につき2〜3個を選ぶ</text>
</svg>
