<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 730" width="720" height="730" role="img" aria-label="投稿の3つの種類：最新情報はお店の今を伝える、特典はセールやサービスを伝える、イベントは日時の決まった催しを伝える" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
<rect width="720" height="730" rx="32" fill="#f7f4ec"/>
