<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 856" role="img" aria-label="よくある案内とおすすめの案内の比較：休みの期間は「年末年始はお休みします」より「12月31日（木）〜1月3日（日）休業」。再開の日は「年明けは通常どおり営業」より「1月4日（月）11時から営業」。休み中の連絡は「詳しくはお問い合わせを」より「休業中の予約はLINEで受付」" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="856" rx="32" fill="#f7f4ec"/><text x="360" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">よくある案内とおすすめ</text><text x="44" y="142" font-size="30" font-weight="800" fill="#386377">休みの期間</text><rect x="40" y="160" width="640" height="76" rx="18" fill="#ece8db"/><circle cx="80" cy="198" r="20" fill="#64665d"/><path d="M72 190 l16 16 m0 -16 l-16 16" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><text x="114" y="208" font-size="29" fill="#64665d">年末年始はお休みします</text><rect x="40" y="248" width="640" height="76" rx="18" fill="#fffdf7" stroke="#dd7c43" stroke-width="4"/><circle cx="80" cy="286" r="20" fill="#dd7c43"/><path d="M71 286 l7 8 l13 -14" fill="none" stroke="#fffdf7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="296" font-size="29" font-weight="700" fill="#272923">12月31日（木）〜1月3日（日）休業</text><text x="44" y="388" font-size="30" font-weight="800" fill="#386377">再開の日</text><rect x="40" y="406" width="640" height="76" rx="18" fill="#ece8db"/><circle cx="80" cy="444" r="20" fill="#64665d"/><path d="M72 436 l16 16 m0 -16 l-16 16" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><text x="114" y="454" font-size="29" fill="#64665d">年明けは通常どおり営業</text><rect x="40" y="494" width="640" height="76" rx="18" fill="#fffdf7" stroke="#dd7c43" stroke-width="4"/><circle cx="80" cy="532" r="20" fill="#dd7c43"/><path d="M71 532 l7 8 l13 -14" fill="none" stroke="#fffdf7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="542" font-size="29" font-weight="700" fill="#272923">1月4日（月）11時から営業</text><text x="44" y="634" font-size="30" font-weight="800" fill="#386377">休み中の連絡</text><rect x="40" y="652" width="640" height="76" rx="18" fill="#ece8db"/><circle cx="80" cy="690" r="20" fill="#64665d"/><path d="M72 682 l16 16 m0 -16 l-16 16" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><text x="114" y="700" font-size="29" fill="#64665d">詳しくはお問い合わせを</text><rect x="40" y="740" width="640" height="76" rx="18" fill="#fffdf7" stroke="#dd7c43" stroke-width="4"/><circle cx="80" cy="778" r="20" fill="#dd7c43"/><path d="M71 778 l7 8 l13 -14" fill="none" stroke="#fffdf7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="788" font-size="29" font-weight="700" fill="#272923">休業中の予約はLINEで受付</text></svg>