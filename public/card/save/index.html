<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef4fa">
  <meta name="robots" content="noindex,nofollow">
  <title>名刺画像を保存 | 小野 秀太・OnO International</title>
  <meta name="description" content="小野秀太の名刺画像をダウンロードして、スマホの写真アプリに保存できます。">
  <link rel="icon" href="../assets/ono-logo.png" type="image/png">
  <link rel="canonical" href="https://ono-international.com/card/save/">
  <link rel="stylesheet" href="save.css">
  <script src="save.js?v=20261101-tagline" defer></script>
</head>
<body>
  <main>
    <a class="back" href="../">← 名刺に戻る</a>
    <header><p class="eyebrow">ONO INTERNATIONAL</p><h1>名刺画像を保存</h1><p>写真アプリから、いつでも名刺を見せられます。</p></header>
    <section class="actions" aria-label="画像の保存方法">
      <button id="save-photo" class="primary" type="button" hidden>写真に保存する</button>
      <p id="share-help" hidden>共有画面が開いたら「画像を保存」を選んでください。</p>
      <a class="download" href="../assets/shuta-ono-card.png?v=20261101-tagline" download="小野秀太_OnO名刺.png">名刺画像をダウンロード</a>
      <p class="hint">下の画像を長押しして保存することもできます。<br>保存後は「写真」のお気に入りに入れると便利です。</p>
      <p id="save-status" class="status" role="status" aria-live="polite"></p>
    </section>
    <img class="card-image" src="../assets/shuta-ono-card.png?v=20261101-tagline" width="1080" height="2400" alt="小野秀太の名刺画像。電話080-6994-3810、メールhibiki20240414@gmail.com、OnO公式サイトと連絡先保存用QRコード。">
    <p class="image-note">高画質PNG · 1080 × 2400 px<br>画像のQRから、連絡先を保存するページが開きます。</p>
    <a class="original" href="../assets/shuta-ono-card.png?v=20261101-tagline">画像だけを開く ↗</a>
  </main>
</body>
</html>
