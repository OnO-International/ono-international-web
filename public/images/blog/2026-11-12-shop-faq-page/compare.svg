<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1214" width="720" height="1214" role="img" aria-label="よくある答え方とおすすめの答え方の比較：駐車場は「近くにあります」より「店舗前に1台。満車の時は徒歩2分の有料駐車場へ」。予約は「お気軽にどうぞ」より「Webと電話で受付中。当日のご予約はお電話で」。アレルギーは「対応できます」より「事前にご相談ください。完全な除去は難しい場合も」" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="1214" rx="32" fill="#f7f4ec"/><text x="360" y="80" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">よくある答え方とおすすめ</text><rect x="40" y="116" width="10" height="38" rx="5" fill="#dd7c43"/><text x="64" y="148" font-size="35" font-weight="800" fill="#272923">駐車場</text><rect x="40" y="170" width="640" height="108" rx="20" fill="#ece8db"/><path d="M64 192 l20 20 m0 -20 l-20 20" stroke="#64665d" stroke-width="5" stroke-linecap="round"/><text x="98" y="212" font-size="29" font-weight="700" fill="#64665d">よくある例</text><text x="64" y="258" font-size="29" fill="#64665d">「近くにあります」</text><rect x="40" y="290" width="640" height="152" rx="20" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="74" cy="322" r="11" fill="none" stroke="#dd7c43" stroke-width="5"/><text x="98" y="332" font-size="29" font-weight="800" fill="#dd7c43">おすすめ</text><text x="64" y="378" font-size="29" font-weight="700" fill="#272923">店舗前に1台。満車の時は</text><text x="64" y="420" font-size="29" font-weight="700" fill="#272923">徒歩2分の有料駐車場へ</text><rect x="40" y="482" width="10" height="38" rx="5" fill="#dd7c43"/><text x="64" y="514" font-size="35" font-weight="800" fill="#272923">予約</text><rect x="40" y="536" width="640" height="108" rx="20" fill="#ece8db"/><path d="M64 558 l20 20 m0 -20 l-20 20" stroke="#64665d" stroke-width="5" stroke-linecap="round"/><text x="98" y="578" font-size="29" font-weight="700" fill="#64665d">よくある例</text><text x="64" y="624" font-size="29" fill="#64665d">「お気軽にどうぞ」</text><rect x="40" y="656" width="640" height="152" rx="20" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="74" cy="688" r="11" fill="none" stroke="#dd7c43" stroke-width="5"/><text x="98" y="698" font-size="29" font-weight="800" fill="#dd7c43">おすすめ</text><text x="64" y="744" font-size="29" font-weight="700" fill="#272923">Webと電話で受付中。</text><text x="64" y="786" font-size="29" font-weight="700" fill="#272923">当日のご予約はお電話で</text><rect x="40" y="848" width="10" height="38" rx="5" fill="#dd7c43"/><text x="64" y="880" font-size="35" font-weight="800" fill="#272923">アレルギー</text><rect x="40" y="902" width="640" height="108" rx="20" fill="#ece8db"/><path d="M64 924 l20 20 m0 -20 l-20 20" stroke="#64665d" stroke-width="5" stroke-linecap="round"/><text x="98" y="944" font-size="29" font-weight="700" fill="#64665d">よくある例</text><text x="64" y="990" font-size="29" fill="#64665d">「対応できます」</text><rect x="40" y="1022" width="640" height="152" rx="20" fill="#fffdf7" stroke="#386377" stroke-width="4"/><circle cx="74" cy="1054" r="11" fill="none" stroke="#dd7c43" stroke-width="5"/><text x="98" y="1064" font-size="29" font-weight="800" fill="#dd7c43">おすすめ</text><text x="64" y="1110" font-size="29" font-weight="700" fill="#272923">事前にご相談ください。</text><text x="64" y="1152" font-size="29" font-weight="700" fill="#272923">完全な除去は難しい場合も</text></svg>