<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" width="720" height="840" role="img" aria-label="外国語メニューに書いておきたい食材：豚肉 Pork、牛肉 Beef、お酒・みりん Alcohol、魚介・だし Fish / Seafood、卵・乳 Egg / Milk、小麦・ナッツ Wheat / Nuts。宗教・信条・体質などで食べられない食材を確かめたいお客様がいます。分からない時は厨房に確認" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="720" height="840" rx="32" fill="#f7f4ec"/><text x="360" y="80" text-anchor="middle" font-size="40" font-weight="800" fill="#272923">書いておきたい主な食材</text><rect x="40" y="120" width="310" height="130" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="80" cy="170" r="12" fill="#dd7c43"/><text x="106" y="182" font-size="35" font-weight="800" fill="#272923">豚肉</text><text x="106" y="226" font-size="29" fill="#386377">Pork</text><rect x="370" y="120" width="310" height="130" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="410" cy="170" r="12" fill="#dd7c43"/><text x="436" y="182" font-size="35" font-weight="800" fill="#272923">牛肉</text><text x="436" y="226" font-size="29" fill="#386377">Beef</text><rect x="40" y="270" width="310" height="130" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="80" cy="320" r="12" fill="#dd7c43"/><text x="106" y="332" font-size="35" font-weight="800" fill="#272923">お酒・みりん</text><text x="106" y="376" font-size="29" fill="#386377">Alcohol</text><rect x="370" y="270" width="310" height="130" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="410" cy="320" r="12" fill="#dd7c43"/><text x="436" y="332" font-size="35" font-weight="800" fill="#272923">魚介・だし</text><text x="436" y="376" font-size="29" fill="#386377">Fish / Seafood</text><rect x="40" y="420" width="310" height="130" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="80" cy="470" r="12" fill="#dd7c43"/><text x="106" y="482" font-size="35" font-weight="800" fill="#272923">卵・乳</text><text x="106" y="526" font-size="29" fill="#386377">Egg / Milk</text><rect x="370" y="420" width="310" height="130" rx="22" fill="#fffdf7" stroke="#cecec0" stroke-width="3"/><circle cx="410" cy="470" r="12" fill="#dd7c43"/><text x="436" y="482" font-size="35" font-weight="800" fill="#272923">小麦・ナッツ</text><text x="436" y="526" font-size="29" fill="#386377">Wheat / Nuts</text><rect x="40" y="580" width="640" height="220" rx="22" fill="#dd7c43" fill-opacity="0.14"/><text x="360" y="638" text-anchor="middle" font-size="31" font-weight="700" fill="#272923">宗教・信条・体質などで</text><text x="360" y="684" text-anchor="middle" font-size="31" font-weight="700" fill="#272923">食べられない食材を</text><text x="360" y="730" text-anchor="middle" font-size="31" font-weight="700" fill="#272923">確かめたいお客様がいます</text><text x="360" y="776" text-anchor="middle" font-size="31" font-weight="700" fill="#272923">分からない時は厨房に確認</text></svg>